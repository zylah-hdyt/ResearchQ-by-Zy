<script>
const WORDS={{WORDS}};      // [{s,e,words:[[w,onset],...]}]
const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};       // {name: dataURI}
const GRAIN={{GRAIN}};const LOGO={{LOGOS}};const HAIR={{HAIR}};
const $=s=>document.querySelector(s);
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),o4=x=>1-Math.pow(1-x,4),i3=x=>x*x*x,io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ox=x=>x>=1?1:1-Math.pow(2,-10*x);
const bk=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N=WORDS.length, ST=WORDS.map(w=>w.s), END=WORDS[N-1].e+3.2;
const W=(k,i)=>WORDS[k].words[Math.min(i,WORDS[k].words.length-1)][1];      // onset of word i in sentence k
const SEND=k=>k<N-1?ST[k+1]:END;
function sh(el,on){el.style.display=on?'block':'none';return on}
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
// generic animated element: pop-in at a (bounce), optional exit at b
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.6,r=0,c=false}={}){const p=P(t,a,a+.42),q=P(t,b,b+.2);const e=p>0?bk(p):0;
  el.style.opacity=(cl(p*4)*(1-q)).toFixed(3);el.style.transform=`${c?'translate(-50%,-50%) ':''}translate(${((1-o3(p))*dx).toFixed(1)}px,${((1-o3(p))*dy).toFixed(1)}px) rotate(${(r*(1-o3(p))).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`}
// stamp text: letters drop in one by one; accent letters slam
function mkStamp(id,words,top,size=150){const el=document.createElement('div');el.className='stamp';el.id=id;el.style.top=top+'px';el.style.fontSize=size+'px';
  el.innerHTML=words.map(([w,ac])=>`<span style="position:relative;display:inline-block;margin:0 .12em">${[...w].map(ch=>`<i class="${ac?'ac':''}">${ch===' '?'&nbsp;':ch}</i>`).join('')}${ac?'<b class="ul" style="left:0;right:0;bottom:-6px"></b>':''}</span>`).join('');return el}
function stamp(el,t,a,b=1e9){const ls=[...el.querySelectorAll('i')];let k=0;ls.forEach((l,i)=>{const s=a+i*.032,p=P(t,s,s+.26),e=p>0?bk(p,2.2):0,ac=l.classList.contains('ac');
    l.style.opacity=(cl(p*5)).toFixed(3);l.style.transform=`translateY(${((1-e)*(ac?-160:-90)).toFixed(1)}px) rotate(${((1-o3(p))*(i%2?16:-14)).toFixed(2)}deg) scale(${(1+(ac?.6:.3)*(1-o3(p))).toFixed(3)})`});
  el.querySelectorAll('.ul').forEach(u=>{u.style.transform=`scaleX(${o4(P(t,a+ls.length*.032,a+ls.length*.032+.3)).toFixed(3)})`});
  const q=P(t,b,b+.18);el.style.opacity=(1-q).toFixed(3);el.style.transform=`scale(${(1-.08*q).toFixed(3)})`}
// hand-drawn loop around a box
function loopPath(x,y,w,h,seed){const r=rng(seed),cx=x+w/2,cy=y+h/2;let d='';for(let i=0;i<=34;i++){const a=-1.9+i/34*2*Math.PI*1.08,j=1+(r()-.5)*.07;const px=cx+Math.cos(a)*w/2*j,py=cy+Math.sin(a)*h/2*j;d+=(i?' L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
function mkDraw(parent,d,w=7){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','dr');s.setAttribute('width','1080');s.setAttribute('height','1920');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.style.strokeWidth=w;s.appendChild(p);parent.appendChild(s);const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.dataset.l=l;return p}
function rrPath(x,y,w,h,r){return `M${x+r} ${y} H${x+w-r} A${r} ${r} 0 0 1 ${x+w} ${y+r} V${y+h-r} A${r} ${r} 0 0 1 ${x+w-r} ${y+h} H${x+r} A${r} ${r} 0 0 1 ${x} ${y+h-r} V${y+r} A${r} ${r} 0 0 1 ${x+r} ${y} Z`}
function mkBox(k,get,pad=14,r=24,w=5,gx=null){const p=mkDraw(SC[k],'M0 0',w);p._box={k,get,pad,r,gx};return p}
function bb(k,els){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const e of els){let x=0,y=0,n=e;while(n&&n!==SC[k]){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}
    x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+e.offsetWidth);y1=Math.max(y1,y+e.offsetHeight)}return [x0,y0,x1,y1]}
function boxInit(p){if(p._done)return;const {k,get,pad,r,gx}=p._box;let [x0,y0,x1,y1]=bb(k,get());if(gx){const q=bb(k,gx());x0=q[0];x1=q[2]}
  if(!(x1>x0))return;p.setAttribute('d',rrPath(x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad,r));const l=p.getTotalLength();p.style.strokeDasharray=l;p.dataset.l=l;p._done=1}
function draw(p,t,a,dur=.35){if(p._box)boxInit(p);p.style.strokeDashoffset=(+p.dataset.l*(1-o3(P(t,a,a+dur)))).toFixed(1)}
const CUR='<svg viewBox="0 0 46 56" width="70" height="84"><path d="M4 3 L4 44 L15 34 L23 52 L31 48 L23 31 L39 31 Z" fill="#1B1A18" stroke="#FBF7F0" stroke-width="3" stroke-linejoin="round"/></svg>';

// ---------- scene backgrounds (per sentence): dark / cream / orange
const BG=['#141311','#F2EFE9','#EE6A1F','#F2EFE9','#141311','#F2EFE9','#141311','#F2EFE9','#141311'];
const bgType=c=>c==='#141311'?'d':c==='#EE6A1F'?'o':'l';let BGT='d';
function BGF(t){let k=0;for(let i=0;i<N;i++)if(t>=ST[i]-.25)k=i;const prev=BG[Math.max(0,k-1)],cur=BG[k];const p=k?o3(P(t,ST[k]-.25,ST[k]+.3)):1;
  $('#bga').style.background=prev;const b=$('#bgb');b.style.background=cur;b.style.clipPath=`circle(${(p*2300).toFixed(1)}px at 540px 900px)`;
  BGT=bgType(p>.5?cur:prev);const g=$('#dots');g.style.opacity=1;g.style.backgroundImage=`radial-gradient(circle, ${BGT==='l'?'rgba(27,26,24,.09)':'rgba(255,255,255,.10)'} 1.7px, transparent 2px)`;
  g.style.backgroundPosition=`${(t*6).toFixed(1)}px ${(t*10).toFixed(1)}px`;
  $('#blob1').style.transform=`translate(${(60*Math.sin(t*.35)).toFixed(1)}px,${(40*Math.cos(t*.3)).toFixed(1)}px)`;$('#blob2').style.transform=`translate(${(-50*Math.sin(t*.28)).toFixed(1)}px,${(60*Math.sin(t*.22)).toFixed(1)}px)`;
  op($('#blob1'),BGT==='o'?.0:1);op($('#blob2'),BGT==='o'?.0:1);return BGT==='l'?0:1}

// ---------- kinetic captions: 1-3 word chunks, words land as they are spoken
const EMS=[["simultan.","ada?"],["Hair,"],["simultan","bersamaan."],["bersama-sama"],["F.","nggak"],["R","kuadrat.","gabungan"],["0,62,","62","persen"],["R","kuadrat,","beda."],["panduan","ebook,"]];
const CH=[];WORDS.forEach((s,k)=>{let cur=[];s.words.forEach(([w],i)=>{cur.push(i);const txt=cur.map(j=>s.words[j][0]).join(' ');
  const last=i===s.words.length-1,rem=s.words.length-1-i;if(last||/[,.?:;!]$/.test(w)||cur.length>=3||txt.length>=17){if(rem===1&&!/[,.?:;!]$/.test(w)&&cur.length<3)return;CH.push({k,ids:cur});cur=[]}})});
CH.forEach((c,i)=>{c.a=W(c.k,c.ids[0])-.1;c.v=i%4});CH.forEach((c,i)=>{c.b=i<CH.length-1?CH[i+1].a:END});
$('#kin').innerHTML=CH.map((c,i)=>`<div class="kc" id="kc${i}">${c.ids.map(j=>{const w=WORDS[c.k].words[j][0];return `<span class="kw${EMS[c.k].includes(w)?' em':''}">${w}</span>`}).join('')}</div>`).join('');
function CAP(t,dk){const nc=BGT==='l'?'#1B1A18':'#FFFFFF',ec=BGT==='l'?'#EE6A1F':BGT==='o'?'#1B1A18':'#FF8A3D';
  CH.forEach((c,i)=>{const el=$('#kc'+i);const on=t>=c.a-.05&&t<c.b&&t<END-2.75;if(!sh(el,on))return;el.style.display='flex';
  const q=P(t,c.b-.13,c.b);el.style.opacity=(1-q).toFixed(3);el.style.transform=`translateY(${(-60*o3(q)).toFixed(1)}px) scale(${(1-.06*q).toFixed(3)})`;
  [...el.children].forEach((sp,j)=>{const o=W(c.k,c.ids[j]),p=P(t,o-.07,o+.23),e=o4(p),b=p>0?bk(p,1.4):0;let tr='',f='none';
    if(c.v===0)tr=`translateY(${((1-e)*70).toFixed(1)}px) rotate(${((1-e)*6).toFixed(2)}deg)`;
    else if(c.v===1){tr=`scale(${(1.6-.6*b).toFixed(3)})`;f=`blur(${((1-e)*12).toFixed(1)}px)`}
    else if(c.v===2)tr=`translateX(${((1-e)*90).toFixed(1)}px)`;
    else tr=`translateY(${((1-b)*-60).toFixed(1)}px)`;
    const em=sp.classList.contains('em');if(em)tr+=` scale(${(1+.08*Math.sin(Math.PI*P(t,o+.15,o+.5))).toFixed(3)})`;
    sp.style.opacity=cl(p*2.5).toFixed(3);sp.style.transform=tr;sp.style.filter=f;sp.style.color=em?ec:nc})})}

// ---------- mascot pose timeline (9 poses)
const PT=[[0,'m_think'],[W(0,6)-.1,'n_shrug'],[ST[1]-.05,'n_present'],[ST[2]-.05,'n_idea'],[ST[3]-.05,'m_point'],[ST[4]-.05,'n_shrug'],[W(4,6)-.1,'m_warn'],[ST[5]-.05,'n_idea'],[ST[6]-.05,'m_open'],[ST[7]-.05,'n_present'],[W(7,11)-.1,'m_thumb'],[ST[8]-.05,'n_wink']];
const SC=[];for(let k=0;k<N;k++){const d=document.createElement('div');d.className='sc';d.id='s'+k;$('#scenes').appendChild(d);SC.push(d)}
function H(k,html){SC[k].insertAdjacentHTML('beforeend',html)}
const circ=(id,x,y,r,txt,cls='')=>`<div class="ab nd ${cls}" id="${id}" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:#FBFAF7;border:5px solid #1B1A18;font-family:Anton;font-size:${r*.8}px;line-height:${2*r-10}px;text-align:center;box-shadow:0 18px 30px -14px rgba(0,0,0,.35)">${txt}</div>`;

// S0 hook (dark): mini SEM-PLS path model + "?"
H(0,`<div class="chip" id="ch0" style="left:72px;top:620px;background:#EE6A1F">SEM-PLS · SMARTPLS</div>
  ${circ('x10',260,760,70,'X1')}${circ('x20',260,960,70,'X2')}${circ('y0',720,860,90,'Y')}
  <div class="ab" id="qm0" style="left:830px;top:640px;font-family:IS;font-style:italic;font-size:220px;color:#FF8A3D">?</div>`);
SC[0].appendChild(mkStamp('st0',[['UJI',0],['SIMULTAN?',1]],1110,130));$('#st0').style.color='#FFFFFF';

// S1 Hair cover (cream)
H(1,`<div class="ab" id="bk1" style="left:325px;top:625px;width:430px;height:556px;perspective:1400px"><img id="cv1" src="${HAIR.cover}" style="width:430px;height:556px;border-radius:6px;box-shadow:0 40px 70px -20px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.2)"></div>
  <div class="card nt1" style="left:50px;top:700px;width:250px;padding:20px 22px;transform:rotate(-5deg)"><div class="mono" style="font-size:18px;color:#8C877E">📖 RUJUKAN</div><div style="font-family:PJS;font-weight:800;font-size:30px;line-height:1.15;margin-top:6px">utama SEM-PLS</div></div>
  <div class="card nt1" style="left:775px;top:930px;width:255px;padding:20px 22px;transform:rotate(4deg)"><div class="mono" style="font-size:18px;color:#EE6A1F">BAB 6</div><div style="font-family:PJS;font-weight:800;font-size:28px;line-height:1.15;margin-top:6px">evaluasi model struktural</div></div>
  <div class="ab mono" id="cit1" style="left:0;width:1080px;top:1215px;text-align:center;font-size:24px;color:#8C877E">Hair, Hult, Ringle & Sarstedt (2022) · 3rd edition</div>`);

// S2 KBBI (orange)
