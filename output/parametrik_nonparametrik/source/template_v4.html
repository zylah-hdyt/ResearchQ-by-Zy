<!doctype html>

<style>

<script>
const SENT={{WORDS}};const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,bk=(x,s=1.3)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const hsh=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const N=SENT.length,END=SENT[N-1].e+1.4;
// word lookup: FW(sentenceIndex, needle, occurrence)
const FW=(k,nd,occ=0)=>{const ws=SENT[k].words;let c=0;for(const w of ws){if(w[0].toLowerCase().replace(/[^a-z0-9]/g,'').includes(nd.toLowerCase())){if(c===occ)return w[1];c++}}return SENT[k].s};
const SS=k=>SENT[k].s,SE=k=>SENT[k].e;
function op(el,v){el.style.opacity=cl(v).toFixed(3)}function sh(el,on){el.style.display=on?'block':'none';return on}
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.85,d=.55}={}){if(!el)return;const p=P(t,a,a+d),q=P(t,b,b+.35),e=p>0?bk(p):0;
  el.style.opacity=(cl(p*2.5)*(1-q)).toFixed(3);el.style.transform=`translate(${((1-o3(p))*dx+q*0).toFixed(1)}px,${((1-o3(p))*dy-q*20).toFixed(1)}px) scale(${(s0+(1-s0)*e).toFixed(4)})`}
function initPaths(){$$('path.dp').forEach(p=>{const l=p.getTotalLength();p.dataset.l=l;p.style.strokeDasharray=l;p.style.strokeDashoffset=l})}
function draw(p,t,a,dur=.6){if(!p)return;const k=io3(P(t,a,a+dur));p.style.strokeDashoffset=(+p.dataset.l*(1-k)).toFixed(1);p.style.opacity=t<a?0:1}
const V=$('#vis');const add=h=>V.insertAdjacentHTML('beforeend',h);

// ---------- living background: slow gradient blobs, 3-depth particles, data nodes + links, translucent stat grid
(function(){let h=`<div class="ab" style="inset:0;background:radial-gradient(ellipse at 50% 30%,#163065 0%,#0E1E44 45%,#081226 100%)"></div>
 <div class="blob" id="b1" style="left:-120px;top:120px;width:760px;height:760px;background:rgba(61,139,255,.30)"></div>
 <div class="blob" id="b2" style="left:520px;top:900px;width:700px;height:700px;background:rgba(92,200,255,.18)"></div>
 <div class="blob" id="b3" style="left:600px;top:60px;width:420px;height:420px;background:rgba(255,159,67,.12)"></div>
 <div class="ab" id="grid" style="left:-200px;top:-200px;width:1600px;height:2400px;background-image:linear-gradient(rgba(92,200,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(92,200,255,.06) 1px,transparent 1px);background-size:80px 80px"></div>
 <svg class="ov" id="geo" width="1240" height="2080"><g fill="none" stroke="rgba(92,200,255,.12)" stroke-width="2"><circle id="g1" cx="900" cy="420" r="210"/><circle cx="900" cy="420" r="150"/><path id="g2" d="M120 1480 l160 -92 l160 92 l0 184 l-160 92 l-160 -92 z"/><path d="M80 300 Q 300 220 520 330 T 960 280" stroke="rgba(255,159,67,.14)"/></g></svg>
 <svg class="ov" id="net" width="1240" height="2080"></svg>`;
 for(let i=0;i<54;i++){const z=i%3;h+=`<i class="pt" data-i="${i}" data-z="${z}" style="position:absolute;width:${[3,5,8][z]}px;height:${[3,5,8][z]}px;border-radius:50%;background:${i%7===0?'rgba(255,209,102,.6)':'rgba(140,200,255,.55)'};filter:blur(${[0,.5,1.5][z]}px)"></i>`}
 $('#bg').innerHTML=h;
 const nodes=Array.from({length:12},(_,i)=>[120+hsh(i+1)*1000,200+hsh(i+21)*1500]);window.NODES=nodes;
 $('#net').innerHTML=nodes.map((n,i)=>`<circle class="nd" cx="${n[0]}" cy="${n[1]}" r="4" fill="rgba(92,200,255,.6)"/>`).join('')+nodes.map((n,i)=>{const m=nodes[(i*5+3)%nodes.length];return `<line class="lk" data-i="${i}" x1="${n[0]}" y1="${n[1]}" x2="${m[0]}" y2="${m[1]}" stroke="rgba(92,200,255,.35)" stroke-width="1.5"/>`}).join('')})();
function BG(t,par){$('#b1').style.transform=`translate(${(90*Math.sin(t*.13)).toFixed(1)}px,${(60*Math.cos(t*.11)).toFixed(1)}px)`;$('#b2').style.transform=`translate(${(-80*Math.sin(t*.1)).toFixed(1)}px,${(70*Math.sin(t*.09)).toFixed(1)}px)`;$('#b3').style.transform=`translate(${(50*Math.cos(t*.12)).toFixed(1)}px,${(40*Math.sin(t*.15)).toFixed(1)}px)`;
  $('#grid').style.transform=`translate(${(-(t*6)%80+par*20).toFixed(1)}px,${(-(t*9)%80).toFixed(1)}px)`;$('#geo').style.transform=`translate(${(par*35).toFixed(1)}px,0) rotate(${(t*.4).toFixed(2)}deg)`;$('#geo').style.transformOrigin='900px 420px';
  $$('#bg .pt').forEach(p=>{const i=+p.dataset.i,z=+p.dataset.z,sp=[8,16,28][z],x=(hsh(i)*1240+Math.sin(t*.3+i)*30+par*[10,25,45][z]),y=((hsh(i+50)*2080-t*sp)%2080+2080)%2080;p.style.left=x.toFixed(1)+'px';p.style.top=y.toFixed(1)+'px';p.style.opacity=(.35+.45*(.5+.5*Math.sin(t*.8+i))).toFixed(2)});
  $$('#net .lk').forEach(l=>{const i=+l.dataset.i,ph=(t*.25+hsh(i)*6)%6;l.style.opacity=(ph<1.5?Math.sin(ph/1.5*Math.PI)*.8:0).toFixed(2)})}

// ---------- visual elements
const EX={{EXCERPTS}};const IMG={{IMG}};
const curve=(id,w,h,skew,col)=>{const pts=[];for(let i=0;i<=60;i++){const x=i/60;let y=skew?Math.pow(x,1.2)*Math.exp(-x*7)*14:Math.exp(-Math.pow((x-.5)/.16,2)/2);pts.push(`${(20+x*(w-40)).toFixed(1)} ${(h-20-y*(h-50)).toFixed(1)}`)}
  return `<svg class="ov" width="${w}" height="${h}"><path d="M20 ${h-20} L${w-20} ${h-20}" stroke="rgba(160,190,255,.35)" stroke-width="3"/><path class="dp" id="${id}" d="M${pts.join(' L')}" stroke="${col}" stroke-width="7"/></svg>`};
const excerpt=(id,key,w,label)=>{const e=EX[key],k=w/e.size[0];return `<div class="ab" id="${id}" style="width:${w+40}px;padding:18px 20px 20px;border-radius:22px;background:#FBFAF6;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)">
  <div style="font-family:Inter;font-weight:700;font-size:18px;letter-spacing:.14em;color:#B4532E;margin-bottom:12px">${label}</div>
  <div style="position:relative;width:${w}px;height:${(e.size[1]*k).toFixed(0)}px"><img src="${IMG[key]}" style="position:absolute;left:0;top:0;width:${w}px">
  ${(e.hl||[]).map((r,ri)=>r?`<i class="hl1" style="position:absolute;left:${(r[0]*k).toFixed(1)}px;top:${(r[1]*k).toFixed(1)}px;width:${(r[2]*k).toFixed(1)}px;height:${(r[3]*k).toFixed(1)}px;background:${key==='table'&&ri===0?'rgba(92,200,255,.5)':'rgba(255,209,102,.55)'};mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)"></i>`:'').join('')}
  ${(e.hl2||[]).map(r=>`<i class="hl2" style="position:absolute;left:${(r[0]*k).toFixed(1)}px;top:${(r[1]*k).toFixed(1)}px;width:${(r[2]*k).toFixed(1)}px;height:${(r[3]*k).toFixed(1)}px;background:rgba(92,200,255,.45);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)"></i>`).join('')}</div></div>`};
// hook
add(`<div class="kin" id="h_t" style="left:0;width:1080px;top:190px;font-size:88px;line-height:1.05;color:#fff;white-space:normal">Parametrik<br><span style="color:#5CC8FF">vs</span> Nonparametrik</div>
 <div class="card" id="h_p" style="left:60px;top:470px;width:460px;height:330px;padding:22px"><div class="lab">Distribusi normal</div><div class="ab" style="left:10px;top:60px;width:440px;height:250px">${curve('h_pc',440,250,false,'#5CC8FF')}</div></div>
 <div class="card" id="h_n" style="left:560px;top:470px;width:460px;height:330px;padding:22px"><div class="lab" style="color:#FFD166">Tidak normal</div><div class="ab" style="left:10px;top:60px;width:440px;height:250px">${curve('h_nc',440,250,true,'#FFD166')}</div></div>
 <div class="kin" id="h_q" style="left:0;width:1080px;top:850px;font-size:58px;color:#FFD166">Kapan dipakai?</div>`);
// save & follow
add(`<div class="ab" id="i_save" style="left:410px;top:660px;width:260px;text-align:center"><div style="height:250px;display:flex;align-items:center;justify-content:center"><svg width="190" height="240" viewBox="0 0 150 190"><path d="M20 10 h110 a10 10 0 0 1 10 10 v160 l-65 -45 l-65 45 v-160 a10 10 0 0 1 10 -10z" fill="#FFD166"/></svg></div><div class="kin keep" style="position:relative;font-size:66px;color:#fff;margin-top:24px">Save</div></div>
 <div class="ab" id="i_fol" style="left:620px;top:660px;width:260px;text-align:center"><div style="height:250px;display:flex;align-items:center;justify-content:center"><svg width="240" height="240" viewBox="0 0 170 170"><circle cx="85" cy="85" r="80" fill="#3D8BFF"/><circle cx="70" cy="66" r="24" fill="#fff"/><path d="M30 128 q40 -50 80 0" fill="#fff"/><rect x="112" y="58" width="36" height="9" rx="4" fill="#fff"/><rect x="125" y="45" width="9" height="36" rx="4" fill="#fff"/></svg></div><div class="kin keep" style="position:relative;font-size:66px;color:#fff;margin-top:24px">Follow</div></div>`);
// article: title + definition
const HLR=(rs,ox,oy,col)=>rs.map((r,i)=>`<i class="hl" style="left:${r[0]+ox}px;top:${r[1]+oy}px;width:${r[2]}px;height:${r[3]}px;background:${typeof col==='string'?col:col[i]}"></i>`).join('');
add(`<div class="rw" id="rw1" style="top:190px;height:880px"><div class="rd" id="rd1"><div class="pg"><img src="${IMG.pg1}">${HLR(EX.def.hl,940,1380,'rgba(255,209,102,.6)').replace(/class="hl"/g,'class="hl hl1"')}${HLR(EX.def.hl2,940,1380,'rgba(92,200,255,.5)').replace(/class="hl"/g,'class="hl hl2"')}</div><div class="rlab" id="rl1">ARTIKEL RUJUKAN</div></div>
  <div class="cov" id="cov1"><i style="position:absolute;left:0;top:0;bottom:0;width:26px;background:#FF9F43"></i>
   <div style="position:absolute;left:80px;top:90px;font-family:Inter;font-weight:700;font-size:24px;letter-spacing:.16em;color:#FFC48A">GLOBAL SPINE JOURNAL · 2018</div>
   <div style="position:absolute;left:80px;top:160px;width:820px;font-family:PJS;font-weight:800;font-size:66px;line-height:1.08;color:#fff">Parametric and Nonparametric Tests in Spine Research</div>
   <div style="position:absolute;left:80px;top:440px;font-family:Inter;font-weight:600;font-size:32px;color:#BFD3FF">Hopkins, Dettori &amp; Chapman</div>
   <svg class="ov" style="left:80px;top:560px" width="840" height="240"><path d="M0 220 C 250 220 300 20 420 20 S 590 220 840 220" fill="none" stroke="rgba(92,200,255,.55)" stroke-width="6"/></svg></div>
  <div class="chip" id="a_p" style="left:24px;top:740px;background:#0B1630;color:#FFE3A0;font-size:28px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)">Parametrik → asumsi distribusi (normal)</div>
  <div class="chip" id="a_n" style="left:24px;top:808px;background:#0B1630;color:#BFE8FF;font-size:28px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)">Nonparametrik → tanpa asumsi bentuk distribusi</div></div>
 <div class="chip" id="a_ref" style="left:90px;top:1092px;background:#0B1630;color:#FFC48A;font-size:24px">Hopkins, Dettori &amp; Chapman (2018) · Global Spine Journal 8(6)</div>`);
// correlation example
add(`<div class="kin" id="k_t" style="left:0;width:1080px;top:190px;font-size:62px;color:#fff">Uji <span style="color:#5CC8FF">korelasi</span> · 2 variabel</div>
 <div class="card" id="k_sc" style="left:290px;top:300px;width:500px;height:330px;padding:20px"><div class="lab">X ↔ Y · ilustrasi</div>
  <svg class="ov" width="500" height="330">${Array.from({length:24},(_,i)=>{const x=50+((i*37)%24)/24*400,y=290-((x-50)/400)*190-((i*53)%7)*12;return `<circle class="k_pt" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="8" fill="rgba(160,190,255,.8)"/>`}).join('')}</svg></div>
