<body><div id="stage">
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter><filter id="mbf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbgf" stdDeviation="0 0"/></filter></svg>

<script>
const WORDS={{WORDS}};const SUBS={{SUBS}};const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};const LOGO={{LOGOS}};const GRAIN={{GRAIN}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,io2=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const bk=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const N=WORDS.length,CTA_D=6.5,END=WORDS[N-1].e+CTA_D+.6;
const W=(k,i)=>WORDS[k].words[Math.min(i,WORDS[k].words.length-1)][1];
const SECS=['intro','s1','s2','s3','s4','s5','s6','outro'];
const SL={};WORDS.forEach((w,i)=>{(SL[w.sec]=SL[w.sec]||[]).push(i)});
const LN=(s,j)=>WORDS[SL[s][j]].s,LE=(s,j)=>WORDS[SL[s][j]].e,LW=(s,j,i)=>W(SL[s][j],i);
const FW=(s,j,nd)=>{const ws=WORDS[SL[s][j]].words;const i=ws.findIndex(w=>w[0].toLowerCase().includes(nd.toLowerCase()));return i<0?ws[0][1]:ws[i][1]};
const SS={};SECS.forEach(s=>SS[s]=s==='intro'?0:LN(s,0)-1.15);
function sh(el,on){el.style.display=on?'block':'none';return on}
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.6,r=0,d=.45}={}){if(!el)return;const p=P(t,a,a+d),q=P(t,b,b+.25);const e=p>0?bk(p):0;
  el.style.opacity=(cl(p*4)*(1-q)).toFixed(3);el.style.transform=`translate(${((1-o3(p))*dx).toFixed(1)}px,${((1-o3(p))*dy-q*20).toFixed(1)}px) rotate(${(r*(1-o3(p))).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`}
function stampIn(el,t,a,rot=-8){const q=P(t,a,a+.28);op(el,q*3);el.style.transform=`rotate(${rot}deg) scale(${(q>0?2.1-1.1*bk(q,2):2.1).toFixed(3)})`}
function initPaths(root){root.querySelectorAll('path.dp').forEach(p=>{const l=p.getTotalLength();p.dataset.l=l;p.style.strokeDasharray=l;p.style.strokeDashoffset=l})}
function draw(p,t,a,dur=.5){if(!p)return;const k=o3(P(t,a,a+dur));p.style.strokeDashoffset=(+p.dataset.l*(1-k)).toFixed(1);p.style.opacity=t<a?0:1}
function typeText(el,t,a,full,cps=38){const n=Math.floor(cl((t-a)*cps,0,full.length));el.textContent=full.slice(0,n)+(t>=a&&n<full.length&&Math.floor(t*4)%2?'▍':'')}
const ARW=(id,d,col='#1B1A18',w=5,head=true)=>`<path class="dp" id="${id}" d="${d}" stroke="${col}" stroke-width="${w}" ${head?`marker-end="url(#ah_${col.slice(1)})"`:''}/>`;
const DEFS=`<defs>${['1B1A18','EE6A1F','FFFFFF','E5463A','F2EFE9'].map(c=>`<marker id="ah_${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#${c}"/></marker>`).join('')}</defs>`;

// ---------- world layout (station centres in world px)
const C={intro:[960,540],s1:[3300,700],s2:[5800,250],s3:[8500,800],s4:[11400,300],s5:[14200,1000],s6:[16000,420],scr:[24200,820]};
const world=$('#world'),far=$('#far');
function ST(id,cx,cy,w=1920,h=1080){const d=document.createElement('div');d.className='st';d.id='st_'+id;d.style.cssText=`left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px`;world.appendChild(d);return d}
const add=(st,h)=>st.insertAdjacentHTML('beforeend',h);
const svg=(w,h,inner)=>`<svg class="ov" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${DEFS}${inner}</svg>`;

// timeline ribbon through all stations + big era labels (seen best in the map zoom-out)
const RIB=[[200,1000],[1500,1250],[3300,1350],[4500,1200],[5800,950],[7200,1500],[8500,1450],[10000,1150],[11400,1050],[12800,1550],[14200,1750],[15300,1000],[16000,800],[21800,800],[23000,1050],[24200,1400]];
(function(){let d=`M${RIB[0][0]} ${RIB[0][1]}`;for(let i=1;i<RIB.length;i++){const [x0,y0]=RIB[i-1],[x1,y1]=RIB[i],mx=(x0+x1)/2;d+=` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`}
  world.insertAdjacentHTML('afterbegin',`<svg class="ov" width="26000" height="2400" viewBox="0 0 26000 2400" style="left:0;top:0">${DEFS}<path id="rib" d="${d}" fill="none" stroke="#EE6A1F" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity=".55"/><path id="ribG" d="${d}" fill="none" stroke="#EE6A1F" stroke-width="14" stroke-linecap="round"/></svg>`)})();
const ERA=[['1904','THE HIDDEN FACTOR',3300,-80],['1921','ARROWS',5800,-560],['1940s–60s','EQUATIONS',8500,-30],['1970s','TWO ROADS',11400,-520],['TWO TYPES','CB vs PLS',14200,200],['1970s–2022','SOFTWARE',18800,-450],['TODAY','YOUR MODEL',24200,-60]];
ERA.forEach(([y,s,x,top],i)=>world.insertAdjacentHTML('beforeend',`<div class="ab era" style="left:${x-2000}px;top:${top-1150}px;width:4000px;text-align:center;opacity:0"><div class="ant" style="font-size:620px;line-height:1;color:#EE6A1F">${y}</div><div class="mono" style="font-size:150px;letter-spacing:.2em;color:#F2EFE9;margin-top:20px">${s}</div></div>`));
// far parallax layer: huge faint numbers
[['1904',2600,200],['1921',5600,-700],['1943',8200,300],['1966',9800,-500],['1973',11800,-900],['PLS',14300,500],['2005',19000,-800],['2022',22000,200]].forEach(([s,x,y])=>far.insertAdjacentHTML('beforeend',`<div class="ghost" style="left:${x}px;top:${y}px;font-size:900px">${s}</div>`));

// ---------- INTRO
const sI=ST('intro',...C.intro);
add(sI,`<div class="ab" id="i_t" style="left:110px;top:190px;width:1300px"><div class="mono" style="font-size:28px;color:#EE6A1F">A SHORT HISTORY OF</div>
  <div class="ant" style="font-size:150px;line-height:.98;color:#fff;margin-top:14px">STRUCTURAL<br>EQUATION <span style="color:#EE6A1F">MODELING</span></div>
  <div class="mono" style="font-size:26px;color:#BDB6AA;margin-top:22px">1904 → 2022 · FROM A HIDDEN FACTOR TO SMARTPLS</div></div>
  <div class="ab" id="i_tags" style="left:110px;top:640px;width:1320px;display:flex;gap:18px">${[['1904','Intelligence tests'],['1921','Guinea pigs'],['1940s','Economists'],['1970s','Teacher & student']].map(([y,s])=>`<div class="tg" style="flex:1;height:150px;border-radius:20px;background:#26231F;border:2px solid rgba(255,255,255,.08);padding:20px 22px"><div class="ant" style="font-size:46px;color:#EE6A1F">${y}</div><div class="big" style="font-size:28px;color:#F2EFE9;margin-top:6px">${s}</div></div>`).join('')}</div>`);

// ---------- S1 1904 Spearman
const s1=ST('s1',...C.s1);
const SUBJ=[['Classics',.86],['French',.8],['English',.76],['Maths',.71],['Music',.64]];
add(s1,`<div class="ghost" style="left:40px;top:-60px;font-size:560px">1904</div>
 <div class="paper" id="a_doc" style="left:120px;top:110px;width:700px;height:740px;padding:46px 50px;transform-origin:50% 60%">
  <div class="mono" style="font-size:20px;color:#9A5A23">PSYCHOLOGY · ENGLAND · 1904</div>
  <div style="display:flex;gap:26px;align-items:center;margin-top:28px"><div style="width:120px;height:120px;border-radius:50%;background:#1B1A18;color:#F4EEE2;font-family:Anton;font-size:52px;line-height:120px;text-align:center">CS</div>
   <div><div class="big" style="font-size:54px;line-height:1">Charles Spearman</div><div style="font-size:26px;font-weight:600;color:#6E6A62;margin-top:10px">British psychologist</div></div></div>
  <div style="height:3px;background:#1B1A18;margin:36px 0 30px;opacity:.85"></div>
  <div class="ser" style="font-size:52px;line-height:1.08">“General Intelligence,” Objectively Determined and Measured</div>
  <div class="mono" style="font-size:20px;color:#6E6A62;margin-top:24px">AMERICAN JOURNAL OF PSYCHOLOGY · 1904</div></div>
 <div class="card" id="a_ch" style="left:900px;top:400px;width:900px;height:450px;padding:26px 34px"><div class="lab">SCHOOL MARKS · ONE CHILD <span style="color:#B5AFA5">(illustration)</span></div>
  <div style="position:absolute;left:34px;right:34px;bottom:70px;height:300px;display:flex;gap:30px;align-items:flex-end">${SUBJ.map(([s,v])=>`<div style="flex:1;height:100%;position:relative"><i class="bar1" data-v="${v}" style="position:absolute;left:0;right:0;bottom:0;height:0;border-radius:12px 12px 4px 4px;background:#1B1A18"></i></div>`).join('')}</div>
  <div style="position:absolute;left:34px;right:34px;bottom:22px;display:flex;gap:30px">${SUBJ.map(([s])=>`<div class="big" style="flex:1;text-align:center;font-size:26px">${s}</div>`).join('')}</div></div>
 <div class="node lat" id="a_g" style="left:1260px;top:120px;width:190px;height:190px;font-family:IS;font-style:italic;font-weight:400;font-size:130px;background:#EE6A1F;color:#fff;border-color:#fff;box-shadow:0 0 0 18px rgba(238,106,31,.18),0 0 80px rgba(238,106,31,.55)">g</div>
 <div class="ab big" id="a_gl" style="left:1480px;top:160px;font-size:34px;color:#fff;line-height:1.15">general<br>intelligence</div>
 ${svg(1920,1080,SUBJ.map((s,i)=>{const x=900+34+(832-120)/5*i+((832-120)/5)/2+i*24;return ARW('a_ar'+i,`M1355 315 Q${(1355+x)/2} ${360} ${x} 450`,'#EE6A1F',6)}).join(''))}
 <div class="stamp" id="a_st" style="left:470px;top:700px;font-size:64px;color:#EE6A1F;border:8px solid #EE6A1F;background:rgba(20,19,17,.9)">FACTOR ANALYSIS</div>
 <div class="ab" id="a_lg" style="left:880px;top:150px;display:flex;flex-direction:column;align-items:flex-end;gap:14px"><div class="chip" style="position:relative;background:#EE6A1F">○ unseen = latent</div><div class="chip" style="position:relative;background:#F2EFE9;color:#1B1A18">□ seen = observed</div></div>`);

// ---------- S2 1921 Wright
const s2=ST('s2',...C.s2);
const GP=`<svg width="520" height="330" viewBox="0 0 520 330"><ellipse cx="260" cy="300" rx="200" ry="18" fill="rgba(0,0,0,.18)"/>
 <path d="M70 210 C60 120 150 70 260 72 C380 74 470 120 468 210 C466 270 400 296 260 296 C130 296 76 270 70 210Z" fill="#FBF4E8" stroke="#1B1A18" stroke-width="6"/>
 <path d="M262 74 C330 76 400 100 440 150 C420 200 360 220 300 200 C270 170 255 120 262 74Z" fill="#1B1A18"/>
 <path d="M150 90 C200 75 240 76 262 80 C250 140 200 170 140 160 C110 150 120 110 150 90Z" fill="#D9822B"/>
 <path d="M300 210 C360 230 420 222 455 200 C460 250 420 280 360 288 C320 280 300 250 300 210Z" fill="#D9822B"/>
 <ellipse cx="120" cy="96" rx="34" ry="24" fill="#E9A9A0" stroke="#1B1A18" stroke-width="5" transform="rotate(-25 120 96)"/>
 <circle cx="108" cy="165" r="12" fill="#1B1A18"/><circle cx="112" cy="161" r="4" fill="#fff"/>
 <path d="M72 196 q-10 8 0 16" fill="none" stroke="#1B1A18" stroke-width="5" stroke-linecap="round"/>
 <ellipse cx="150" cy="292" rx="26" ry="12" fill="#E9A9A0" stroke="#1B1A18" stroke-width="5"/><ellipse cx="380" cy="292" rx="26" ry="12" fill="#E9A9A0" stroke="#1B1A18" stroke-width="5"/></svg>`;

  $$('.stu').forEach((s,i)=>{const a=FW('s6',3,'reach')+((i*37)%44)*.025;const p=P(t,a,a+.25);s.style.transform=`scale(${(p>0?bk(p):0).toFixed(3)})`;s.style.background=i%3?'#F2EFE9':'#EE6A1F'});op($('#r_stu'),P(t,FW('s6',3,'reach')-.1,FW('s6',3,'reach')+.2));

}

// ---------- render
let FRAME=0;
function render(t,n){if(n!==undefined)FRAME=n;
  const c=cam(t),c2=cam(t+1/30);const roll=cl((c2.x-c.x)*c.z*.012,-2.2,2.2);
  world.style.transform=`translate(960px,540px) rotate(${roll.toFixed(3)}deg) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px)`;
  const fz=Math.pow(c.z,.6);far.style.transform=`translate(960px,540px) scale(${fz.toFixed(5)}) translate(${(-c.x*.55).toFixed(1)}px,${(-c.y*.55).toFixed(1)}px)`;
  const vx=Math.abs((c2.x-c.x)*c.z),vy=Math.abs((c2.y-c.y)*c.z),vz=Math.abs(Math.log(c2.z/c.z))*900;
  const bx=Math.min(44,vx*.32+vz*.12),by=Math.min(44,vy*.32+vz*.12);
  if(bx>.7||by>.7){$('#mbg').setAttribute('stdDeviation',bx.toFixed(1)+' '+by.toFixed(1));$('#cam').style.filter='url(#mb)';$('#mbgf').setAttribute('stdDeviation',(bx*.6).toFixed(1)+' '+(by*.6).toFixed(1));$('#camf').style.filter='url(#mbf)'}else{$('#cam').style.filter='none';$('#camf').style.filter='none'}
  $$('.era').forEach(e=>op(e,(.3-c.z)/.12));$('#leak').style.transform=`translate(${(500+420*Math.sin(t*.13)).toFixed(1)}px,${(-500+260*Math.cos(t*.1)).toFixed(1)}px)`;
  $('#grain').style.backgroundImage=`url(${GRAIN[Math.floor(FRAME/2)%GRAIN.length]})`;
  SCN(t);CHAP(t);TICK(t);SUB(t);MASC(t);CTA(t);
  op($('#subbg'),t<END-CTA_D?1:0)}

  const a=END-CTA_D;e('swoosh',a);[0,1,2].forEach(i=>e('pop',a+.5+i*.18,i));e('hit',a+1.0);return E}
