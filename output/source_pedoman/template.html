<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Pedoman Kampus</title>
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(data:font/woff2;base64,{{INTER500}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,{{INTER600}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(data:font/woff2;base64,{{INTER700}}) format('woff2')}
@font-face{font-family:'PJS';font-weight:800;src:url(data:font/woff2;base64,{{PJS800}}) format('woff2')}
@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,{{JBM500}}) format('woff2')}
@font-face{font-family:'IS';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,{{IS400I}}) format('woff2')}
@font-face{font-family:'Anton';font-weight:400;src:url(data:font/woff2;base64,{{ANTON}}) format('woff2')}
:root{--bg:#F2EFE9;--paper:#FBFAF7;--ink:#1B1A18;--muted:#8C877E;--faint:#CBC5BA;--line:#E3DED5;--acc:#EE6A1F;--dk:#1C1B1A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);transform-origin:0 0}
#paper{position:absolute;inset:0;background-image:url({{PAPER}});background-size:512px;mix-blend-mode:multiply;opacity:.35}
#dark{position:absolute;inset:0;background:#151413;opacity:0}
.ab{position:absolute}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.mono{font-family:JBM,monospace;letter-spacing:.06em}
/* HUD */
#lbl{position:absolute;left:72px;top:200px;font-family:JBM;font-size:24px;color:var(--muted);white-space:nowrap}
#ctr{position:absolute;right:72px;top:200px;font-family:JBM;font-size:24px;color:var(--muted);white-space:nowrap;text-align:right}
#ctr b{color:var(--acc);font-weight:500}
/* caption */
.cap{position:absolute;left:72px;top:262px;width:860px;font-size:60px;font-weight:500;line-height:1.1;letter-spacing:-.022em;display:none}
.cap span{display:inline-block;margin-right:.24em;will-change:opacity}
.cap span.em{font-family:IS;font-style:italic;font-weight:400;color:var(--acc);font-size:70px;letter-spacing:-.01em;line-height:.9}
/* building blocks */
.card{position:absolute;background:var(--paper);border-radius:22px;border:2px solid rgba(27,26,24,.08);box-shadow:0 22px 44px -16px rgba(60,40,20,.32),0 2px 0 rgba(0,0,0,.03)}
.dkc{position:absolute;background:var(--dk);color:#F2EFE9;border-radius:24px;box-shadow:0 26px 50px -16px rgba(0,0,0,.45)}
.stamp{position:absolute;left:0;width:1080px;text-align:center;font-family:Anton;font-size:150px;line-height:1;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.stamp i{display:inline-block;font-style:normal}
.stamp i.ac{color:var(--acc)}
.stamp .ul{position:absolute;height:12px;background:var(--acc);border-radius:6px;transform-origin:0 50%}
.chip{position:absolute;padding:12px 24px;border-radius:40px;background:var(--ink);color:#F2EFE9;font-family:JBM;font-size:24px;white-space:nowrap}
.tag{position:absolute;font-family:JBM;font-size:22px;color:var(--muted);white-space:nowrap}
.fico{position:absolute;width:64px;height:78px;border-radius:8px;background:#fff;border:2px solid var(--line)}
.fico:after{content:'';position:absolute;right:-2px;top:-2px;width:20px;height:20px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 0 6px}
svg.dr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.dr path{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.cur{position:absolute;left:0;top:0;width:70px;height:84px;filter:drop-shadow(6px 10px 8px rgba(0,0,0,.35))}
/* mascot */
#mas{position:absolute;left:520px;top:1395px;width:600px;height:584px;transform-origin:50% 100%}
#mas img{position:absolute;left:0;top:0;width:600px;display:none}
/* brand */
#brand{position:absolute;left:72px;top:1486px;font-family:PJS;font-weight:800;font-size:34px;letter-spacing:-.03em;white-space:nowrap}
#brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-left:3px}
#handle{position:absolute;left:72px;top:1532px;font-family:JBM;font-size:20px;color:var(--muted)}
#ht{position:absolute;left:0;top:0}
#cta{position:absolute;inset:0;display:none}
.pl{position:absolute;left:150px;width:780px;height:120px;border-radius:30px;background:var(--paper);box-shadow:0 20px 40px -12px rgba(0,0,0,.45)}
.pl .n{position:absolute;left:40px;top:22px;font-family:JBM;font-size:22px;color:var(--muted);letter-spacing:.12em}
.pl .h{position:absolute;left:40px;top:52px;font-family:PJS;font-weight:800;font-size:40px;letter-spacing:-.02em;color:var(--ink)}
.pl .dot{position:absolute;right:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--acc)}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.06;background-size:1080px 1920px;pointer-events:none}
</style></head>
<body><div id="stage">

<div id="scenes"></div>

<script>
const WORDS={{WORDS}};      // [{s,e,words:[[w,onset],...]}]
const MAS={{MASCOT}};       // {name: dataURI}
const GRAIN={{GRAIN}};
const $=s=>document.querySelector(s);
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),o4=x=>1-Math.pow(1-x,4),i3=x=>x*x*x,io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ox=x=>x>=1?1:1-Math.pow(2,-10*x);
const bk=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N=WORDS.length, ST=WORDS.map(w=>w.s), END=WORDS[N-1].e+2.9;
const W=(k,i)=>WORDS[k].words[Math.min(i,WORDS[k].words.length-1)][1];      // onset of word i in sentence k
const SEND=k=>k<N-1?ST[k+1]:END;
function sh(el,on){el.style.display=on?'block':'none';return on}
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
// generic animated element: pop-in at a (bounce), optional exit at b
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.6,r=0,c=false}={}){const p=P(t,a,a+.42),q=P(t,b,b+.2);const e=p>0?bk(p):0;
  el.style.opacity=(cl(p*4)*(1-q)).toFixed(3);el.style.transform=`${c?'translate(-50%,-50%) ':''}translate(${((1-o3(p))*dx).toFixed(1)}px,${((1-o3(p))*dy).toFixed(1)}px) rotate(${(r*(1-o3(p))).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`}
// stamp text: letters drop in one by one; accent letters slam
function mkStamp(id,words,top,size=150){const el=document.createElement('div');el.className='stamp';el.id=id;el.style.top=top+'px';el.style.fontSize=size+'px';
  el.innerHTML=words.map(([w,ac])=>`<span style="position:relative;display:inline-block;margin:0 .12em">${[...w].map(ch=>`<i class="${ac?'ac':''}">${ch===' '?'&nbsp;':ch}</i>`).join('')}${ac?'<b class="ul" style="left:0;right:0;bottom:-6px"></b>':''}</span>`).join('');return el}
function stamp(el,t,a,b=1e9){const ls=[...el.querySelectorAll('i')];let k=0;ls.forEach((l,i)=>{const s=a+i*.032,p=P(t,s,s+.26),e=p>0?bk(p,2.2):0,ac=l.classList.contains('ac');
    l.style.opacity=(cl(p*5)).toFixed(3);l.style.transform=`translateY(${((1-e)*(ac?-160:-90)).toFixed(1)}px) rotate(${((1-o3(p))*(i%2?16:-14)).toFixed(2)}deg) scale(${(1+(ac?.6:.3)*(1-o3(p))).toFixed(3)})`});
  el.querySelectorAll('.ul').forEach(u=>{u.style.transform=`scaleX(${o4(P(t,a+ls.length*.032,a+ls.length*.032+.3)).toFixed(3)})`});
  const q=P(t,b,b+.18);el.style.opacity=(1-q).toFixed(3);el.style.transform=`scale(${(1-.08*q).toFixed(3)})`}
// hand-drawn loop around a box
function loopPath(x,y,w,h,seed){const r=rng(seed),cx=x+w/2,cy=y+h/2;let d='';for(let i=0;i<=34;i++){const a=-1.9+i/34*2*Math.PI*1.08,j=1+(r()-.5)*.07;const px=cx+Math.cos(a)*w/2*j,py=cy+Math.sin(a)*h/2*j;d+=(i?' L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
function mkDraw(parent,d,w=7){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','dr');s.setAttribute('width','1080');s.setAttribute('height','1920');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.style.strokeWidth=w;s.appendChild(p);parent.appendChild(s);const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.dataset.l=l;return p}
function draw(p,t,a,dur=.35){p.style.strokeDashoffset=(+p.dataset.l*(1-o3(P(t,a,a+dur)))).toFixed(1)}
const CUR='<svg viewBox="0 0 46 56" width="70" height="84"><path d="M4 3 L4 44 L15 34 L23 52 L31 48 L23 31 L39 31 Z" fill="#1B1A18" stroke="#FBF7F0" stroke-width="3" stroke-linejoin="round"/></svg>';

// ---------- build captions
const EMS=[["urutan","penelitian?"],["satu","hal."],["contoh"],["pedoman"],["website","kampus,"],["perpustakaan,","akademik."],["struktur"],["font-nya,","layout-nya."],["dosen","pembimbing,"],["berbeda-beda."],["orang","lain."],["benar."],["pedoman","kampus,"],["Save"]];
(function(){$('#caps').innerHTML=WORDS.map((s,k)=>`<div class="cap" id="cap${k}">${s.words.map(([w],i)=>`<span class="${EMS[k].includes(w)?'em':''}">${w}</span>`).join('')}</div>`).join('')})();
function CAP(t){let k=-1;for(let i=0;i<N;i++)if(t>=ST[i]-.05)k=i;for(let i=0;i<N;i++)sh($('#cap'+i),i===k&&t<END-2.6);if(k<0)return;
  const dk=+($('#dark').style.opacity||0);[...$('#cap'+k).children].forEach((sp,i)=>{const o=W(k,i),p=P(t,o-.04,o+.1);sp.style.opacity=(p>0?.25+.75*p:0).toFixed(3);
    if(!sp.classList.contains('em'))sp.style.color=dk>.5?'#F2EFE9':'#1B1A18'})}
const LBL=['// 01 · masih bingung','// 02 · satu hal','// 03 · jangan cari dulu','// 04 · buka pedoman','// 05 · cari di mana','// 05 · cari di mana','// 06 · struktur kampus','// 07 · font · struktur · layout','// 08 · arahan dospem','// 09 · beda-beda','// 10 · jangan asal copy','// 11 · mulai yang benar','// 12 · cek lagi','// 13 · save'];
const CTR=['','','','LANGKAH <b>1</b>','CARI DI <b>1</b>/3','CARI DI <b>3</b>/3','','SPEK <b>3</b>','LANGKAH <b>2</b>','','','LANGKAH <b>3</b>','',''];
const POSE=['m_think','m_point','m_warn','m_thumb','m_point','m_open','m_point','m_thumb','m_warn','m_open','m_warn','m_thumb','m_think','m_thumb'];

// ---------- scene containers
const SC=[];for(let k=0;k<N;k++){const d=document.createElement('div');d.className='sc';d.id='s'+k;$('#scenes').appendChild(d);SC.push(d)}
function H(k,html){SC[k].insertAdjacentHTML('beforeend',html)}
// S0 chapter cards
const S0C=[['BAB 3',150,560,-9],['DAFTAR PUSTAKA',560,520,7],['BAB 1',330,700,4],['LAMPIRAN',700,720,-6],['BAB 5',170,880,8],['BAB 2',560,900,-4]];
S0C.forEach(([n,x,y,r],i)=>H(0,`<div class="card c0" style="left:${x}px;top:${y}px;width:${n.length>6?330:240}px;height:120px;font-family:Anton;font-size:52px;line-height:120px;text-align:center">${n}</div>`));
H(0,`<div class="ab q0" style="left:900px;top:560px;font-family:IS;font-style:italic;font-size:130px;color:var(--acc)">?</div><div class="ab q0" style="left:90px;top:760px;font-family:IS;font-style:italic;font-size:100px;color:var(--acc)">?</div><div class="ab q0" style="left:470px;top:1050px;font-family:IS;font-style:italic;font-size:90px;color:var(--acc)">?</div>`);
SC[0].appendChild(mkStamp('st0',[['URUTANNYA?',1]],1110,140));
// S1 big "1" tile
H(1,`<div class="dkc" id="one" style="left:390px;top:540px;width:300px;height:380px;font-family:Anton;font-size:300px;line-height:360px;text-align:center">1<div style="position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:14px">${[0,1,2,3,4].map(i=>`<i style="width:18px;height:18px;border-radius:50%;background:${i?'#4a4744':'var(--acc)'}"></i>`).join('')}</div></div>`);
SC[1].appendChild(mkStamp('st1',[['SATU',0],['HAL',1]],1020,150));
// S2 messy pile of found examples
const S2F=[['contoh_skripsi_manajemen.pdf',110,560,-6],['template_BAB1_final(2).docx',300,690,4],['skripsi_kakak_tingkat.pdf',150,830,-3],['format skripsi viral 🔥',380,960,6],['contoh dari internet.zip',200,1090,-5]];
S2F.forEach(([n,x,y,r],i)=>H(2,`<div class="card f2" style="left:${x}px;top:${y}px;width:620px;height:110px"><div class="fico" style="left:24px;top:14px"></div><div class="ab" style="left:110px;top:34px;font-size:34px;font-weight:600;white-space:nowrap">${n}</div></div>`));
// S3 pedoman booklet
H(3,`<div class="ab" id="bk3" style="left:300px;top:520px;width:480px;height:640px;perspective:1600px">
  <div class="card" style="left:0;top:0;width:480px;height:640px;border-radius:12px;padding:56px 44px">${[0,1,2,3,4,5,6,7,8].map(i=>`<i style="display:block;height:14px;border-radius:7px;background:#E3DED5;margin:${i%3?12:30}px 0 0;width:${[80,92,70,96,88,60,94,82,74][i]}%"></i>`).join('')}</div>
  <div id="cov3" style="position:absolute;left:0;top:0;width:480px;height:640px;transform-origin:0 50%;transform-style:preserve-3d">
   <div style="position:absolute;inset:0;border-radius:12px;background:#FBFAF7;border:2px solid rgba(27,26,24,.1);box-shadow:0 30px 60px -20px rgba(60,40,20,.45);backface-visibility:hidden;overflow:hidden">
    <i style="position:absolute;left:0;top:0;bottom:0;width:36px;background:var(--acc)"></i>
    <div style="position:absolute;left:76px;top:80px;font-family:JBM;font-size:22px;color:var(--muted);letter-spacing:.14em">UNIVERSITAS KAMPUSMU</div>
    <div style="position:absolute;left:76px;top:150px;width:360px;font-family:Anton;font-size:76px;line-height:1.02">PEDOMAN PENULISAN SKRIPSI</div>
    <div style="position:absolute;left:76px;bottom:70px;font-family:JBM;font-size:22px;color:var(--muted)">EDISI TERBARU</div></div>
   <div style="position:absolute;inset:0;border-radius:12px;background:#E9E3D8;transform:rotateY(180deg);backface-visibility:hidden"></div></div></div>`);
SC[3].appendChild(mkStamp('st3',[['BUKA',0],['DULU.',1]],1210,130));
// S4 browser
H(4,`<div class="card" id="br4" style="left:80px;top:540px;width:920px;height:640px;overflow:hidden">
  <div class="ab" style="left:0;top:0;width:920px;height:70px;background:#ECE8E1;border-bottom:2px solid var(--line)"><i style="position:absolute;left:28px;top:26px;width:18px;height:18px;border-radius:50%;background:#E5463A"></i><i style="position:absolute;left:56px;top:26px;width:18px;height:18px;border-radius:50%;background:#F0A04B"></i><i style="position:absolute;left:84px;top:26px;width:18px;height:18px;border-radius:50%;background:#58C56A"></i>
   <div class="ab mono" style="left:140px;top:14px;width:640px;height:42px;border-radius:21px;background:#fff;font-size:22px;line-height:42px;padding-left:24px;color:var(--muted)">akademik.kampusmu.ac.id</div></div>
  <div class="ab" style="left:50px;top:110px;font-family:PJS;font-weight:800;font-size:40px">Portal Akademik</div>
  <div class="ab" style="left:50px;top:180px;width:820px;height:90px;border-radius:45px;border:3px solid var(--ink);background:#fff"><div class="ab" id="q4" style="left:36px;top:24px;font-size:38px;font-weight:500;white-space:nowrap"></div>
   <div class="ab" id="sb4" style="right:10px;top:8px;width:68px;height:68px;border-radius:50%;background:var(--acc)"><svg width="68" height="68" viewBox="0 0 68 68"><circle cx="30" cy="30" r="13" fill="none" stroke="#fff" stroke-width="5"/><path d="M40 40 L50 50" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></div></div>
  ${[0,1,2].map(i=>`<div class="ab r4" style="left:50px;top:${310+i*100}px;width:820px;height:84px;border-radius:16px;background:${i?'#F6F3EE':'#FFF3EA'};border:2px solid ${i?'var(--line)':'var(--acc)'}"><div class="fico" style="left:16px;top:6px;width:52px;height:66px;transform:scale(.85)"></div><div class="ab" style="left:84px;top:22px;font-size:32px;font-weight:${i?500:700};white-space:nowrap">${['Pedoman_Penulisan_Skripsi.pdf','Kalender Akademik','Panduan Seminar Proposal'][i]}</div></div>`).join('')}
  <div class="cur" id="cu4">${CUR}</div></div>
  <div class="chip" id="dl4" style="left:540px;top:1230px"><span style="color:var(--acc)">●</span> PDF tersimpan</div>`);
// S5 checklist of where to look
const S5I=[['Website kampus','M10 30 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0 M10 30 L50 30 M30 10 C20 22 20 38 30 50 M30 10 C40 22 40 38 30 50'],['Perpustakaan','M10 14 L10 50 L22 50 L22 14 Z M26 14 L26 50 L38 50 L38 14 Z M42 18 L52 48'],['Bagian akademik','M8 50 L52 50 M12 46 L12 26 M24 46 L24 26 M36 46 L36 26 M48 46 L48 26 M6 24 L30 10 L54 24 Z']];
S5I.forEach(([n,d],i)=>H(5,`<div class="card c5" style="left:120px;top:${560+i*180}px;width:840px;height:150px"><svg class="ab" style="left:40px;top:44px" width="60" height="60" viewBox="0 0 60 60"><path d="${d}" fill="none" stroke="#1B1A18" stroke-width="4" stroke-linejoin="round"/></svg><div class="ab" style="left:130px;top:46px;font-family:PJS;font-weight:800;font-size:46px;letter-spacing:-.02em">${n}</div>
  <div class="ab k5" style="right:40px;top:40px;width:70px;height:70px;border-radius:50%;background:var(--acc)"><svg width="70" height="70" viewBox="0 0 70 70"><path d="M20 36 L31 47 L51 24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`));
// S6 table of contents
const S6R=['BAB I · Pendahuluan','BAB II · Tinjauan Pustaka','BAB III · Metode Penelitian','BAB IV · Hasil & Pembahasan','BAB V · Penutup','Daftar Pustaka','Lampiran'];
H(6,`<div class="dkc" id="toc6" style="left:110px;top:520px;width:860px;height:760px;overflow:hidden"><div class="ab mono" style="left:50px;top:40px;font-size:24px;color:#8C877E">pedoman.pdf · hal. 12</div><div class="ab" style="left:50px;top:84px;font-family:Anton;font-size:64px;color:#F2EFE9">SISTEMATIKA PENULISAN</div>
  ${S6R.map((r,i)=>`<div class="ab r6" style="left:50px;top:${200+i*76}px;width:760px;height:64px;border-bottom:1px solid rgba(255,255,255,.1);font-size:36px;font-weight:600;color:#F2EFE9;white-space:nowrap;line-height:60px">${r}<span style="position:absolute;right:0;font-family:JBM;font-size:24px;color:#8C877E">${[1,9,21,33,58,64,70][i]}</span></div>`).join('')}
  <div class="ab" id="scan6" style="left:0;width:860px;height:70px;background:linear-gradient(90deg,rgba(238,106,31,0),rgba(238,106,31,.45),rgba(238,106,31,0));mix-blend-mode:screen"></div></div>
  <div class="tag" style="left:110px;top:1300px">*contoh — tiap kampus bisa beda</div>`);
