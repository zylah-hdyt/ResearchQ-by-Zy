<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>7 PLS-SEM Mistakes</title>
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(data:font/woff2;base64,{{INTER500}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,{{INTER600}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(data:font/woff2;base64,{{INTER700}}) format('woff2')}
@font-face{font-family:'PJS';font-weight:800;src:url(data:font/woff2;base64,{{PJS800}}) format('woff2')}
@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,{{JBM500}}) format('woff2')}
@font-face{font-family:'IS';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,{{IS400I}}) format('woff2')}
@font-face{font-family:'Anton';font-weight:400;src:url(data:font/woff2;base64,{{ANTON}}) format('woff2')}
:root{--ink:#1B1A18;--paper:#FBFAF7;--muted:#8C877E;--line:#E3DED5;--acc:#EE6A1F;--dk:#141311;--red:#E5463A;--grn:#2E9E5B}
*{box-sizing:border-box}
html,body{margin:0;background:#141311;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);transform-origin:0 0;background:#141311}
.bgl{position:absolute;inset:0}
#dots{background-size:40px 40px}
#blob1{position:absolute;left:-300px;top:-200px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(238,106,31,.16),rgba(238,106,31,0) 68%)}
#blob2{position:absolute;left:900px;top:300px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(255,160,90,.13),rgba(255,160,90,0) 68%)}
.ab{position:absolute}
.sc{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
.mono{font-family:JBM,monospace;letter-spacing:.06em}
.card{position:absolute;background:var(--paper);border-radius:22px;border:2px solid rgba(27,26,24,.08);box-shadow:0 24px 50px -18px rgba(0,0,0,.4),0 2px 0 rgba(0,0,0,.03)}
.chip{position:absolute;padding:10px 22px;border-radius:40px;background:var(--ink);color:#F2EFE9;font-family:JBM;font-size:22px;white-space:nowrap}
.lab{font-family:JBM;font-size:20px;letter-spacing:.12em;color:var(--muted)}
.big{font-family:PJS;font-weight:800;letter-spacing:-.02em}
.stamp{position:absolute;font-family:Anton;text-transform:uppercase;white-space:nowrap;text-align:center}
svg.dr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.dr path{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.cur{position:absolute;left:0;top:0;width:60px;height:72px;filter:drop-shadow(6px 10px 8px rgba(0,0,0,.35))}
/* brand + progress */
#brand{position:absolute;left:60px;top:40px;font-family:PJS;font-weight:800;font-size:34px;letter-spacing:-.03em;white-space:nowrap}
#brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-left:3px}
#prog{position:absolute;left:600px;top:52px;width:720px;height:10px;display:flex;gap:10px}
#prog i{flex:1;border-radius:5px;background:rgba(140,135,126,.35)}
#plab{position:absolute;left:1340px;top:42px;font-family:JBM;font-size:22px;letter-spacing:.1em;white-space:nowrap}
/* section title card */
#tc{position:absolute;inset:0;display:none}
/* subtitles */
#sub{position:absolute;left:70px;top:800px;width:1300px;height:250px}
.en{position:absolute;left:0;top:0;width:1300px;text-align:center;font-family:PJS;font-weight:800;font-size:50px;line-height:1.15;letter-spacing:-.02em;display:none}
.en span{display:inline-block;margin:0 .14em}
.idl{position:absolute;left:30px;top:138px;width:1240px;text-align:center;font-size:30px;font-weight:500;line-height:1.3;display:none}
/* mascot */
#mas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:1650px 1080px;pointer-events:none}
#mas .pz{position:absolute;display:none}
#mas .mo{position:absolute;background-size:100% 100%}
#cta{position:absolute;inset:0;display:none}
.pl{position:absolute;width:560px;height:110px;border-radius:28px;background:var(--paper);box-shadow:0 20px 40px -12px rgba(0,0,0,.45)}
.pl img{position:absolute;left:28px;top:20px;width:70px;height:70px;object-fit:contain}
.pl .n{position:absolute;left:120px;top:20px;font-family:JBM;font-size:20px;color:var(--muted);letter-spacing:.12em}
.pl .h{position:absolute;left:120px;top:48px;font-family:PJS;font-weight:800;font-size:36px;letter-spacing:-.02em;color:var(--ink)}
</style></head>
<body><div id="stage">
<div id="bga" class="bgl"></div><div id="bgb" class="bgl"></div><div id="dots" class="bgl"></div><div id="blob1"></div><div id="blob2"></div>
<div id="scenes"></div>
<div id="brand">ResearchQ<i></i></div><div id="prog"></div><div id="plab"></div>
<div id="sub"></div>
<div id="mas"></div>
<div id="tc"></div>
<div id="cta"></div>
</div>
<script>
const WORDS={{WORDS}};const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};const LOGO={{LOGOS}};const HAIR={{HAIR}};
const $=s=>document.querySelector(s);
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),o4=x=>1-Math.pow(1-x,4),io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bk=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const N=WORDS.length,ST=WORDS.map(w=>w.s),END=WORDS[N-1].e+8.5;
const W=(k,i)=>WORDS[k].words[Math.min(i,WORDS[k].words.length-1)][1];
function sh(el,on){el.style.display=on?'block':'none';return on}
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.6,r=0}={}){const p=P(t,a,a+.42),q=P(t,b,b+.2);const e=p>0?bk(p):0;
  el.style.opacity=(cl(p*4)*(1-q)).toFixed(3);el.style.transform=`translate(${((1-o3(p))*dx).toFixed(1)}px,${((1-o3(p))*dy).toFixed(1)}px) rotate(${(r*(1-o3(p))).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`}
function mkDraw(parent,d,w=12,col='#E5463A'){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','dr');s.setAttribute('width','1920');s.setAttribute('height','1080');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.style.strokeWidth=w;p.style.stroke=col;s.appendChild(p);parent.appendChild(s);const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.dataset.l=l;return p}
function draw(p,t,a,dur=.35){p.style.strokeDashoffset=(+p.dataset.l*(1-o3(P(t,a,a+dur)))).toFixed(1);p.style.opacity=t<a?0:1}
function stampIn(el,t,a,rot=-8){const q=P(t,a,a+.28);op(el,q*3);el.style.transform=`rotate(${rot}deg) scale(${(q>0?2.1-1.1*bk(q,2):2.1).toFixed(3)})`}

// ---------- sections
const SECS=['intro','m1','m2','m3','m4','m5','m6','m7','outro'];
const SL={};WORDS.forEach((w,i)=>{(SL[w.sec]=SL[w.sec]||[]).push(i)});
const SS={};SECS.forEach(s=>SS[s]=s==='intro'?0:ST[SL[s][0]]-1.15);
const SE=s=>{const i=SECS.indexOf(s);return i<SECS.length-1?SS[SECS[i+1]]:END};
const LN=(s,j)=>ST[SL[s][j]], LW=(s,j,i)=>W(SL[s][j],i);
const BGC={intro:'#141311',m1:'#F2EFE9',m2:'#141311',m3:'#F2EFE9',m4:'#141311',m5:'#F2EFE9',m6:'#141311',m7:'#F2EFE9',outro:'#EE6A1F'};
const bgT=c=>c==='#F2EFE9'?'l':c==='#EE6A1F'?'o':'d';let BGT='d';
function curSec(t){let s='intro';for(const k of SECS)if(t>=SS[k])s=k;return s}
function BGF(t){const s=curSec(t),i=SECS.indexOf(s),prev=BGC[SECS[Math.max(0,i-1)]],cur=BGC[s];const p=i?o3(P(t,SS[s],SS[s]+.55)):1;
  $('#bga').style.background=prev;const b=$('#bgb');b.style.background=cur;b.style.clipPath=`circle(${(p*2400).toFixed(1)}px at 960px 540px)`;
  BGT=bgT(p>.5?cur:prev);const g=$('#dots');g.style.backgroundImage=`radial-gradient(circle, ${BGT==='l'?'rgba(27,26,24,.08)':'rgba(255,255,255,.08)'} 1.7px, transparent 2px)`;g.style.backgroundPosition=`${(t*5).toFixed(1)}px ${(t*8).toFixed(1)}px`;
  $('#blob1').style.transform=`translate(${(80*Math.sin(t*.25)).toFixed(1)}px,${(50*Math.cos(t*.2)).toFixed(1)}px)`;$('#blob2').style.transform=`translate(${(-70*Math.sin(t*.2)).toFixed(1)}px,${(60*Math.sin(t*.17)).toFixed(1)}px)`;
  op($('#blob1'),BGT==='o'?0:1);op($('#blob2'),BGT==='o'?0:1);
  const dk=BGT!=='l';$('#brand').style.color=dk?'#FFFFFF':'#1B1A18';return dk}

// ---------- progress bar (mistake k/7)
$('#prog').innerHTML=[1,2,3,4,5,6,7].map(()=>'<i></i>').join('');
function PROG(t,dk){const s=curSec(t),m=s[0]==='m'?+s[1]:(s==='outro'?8:0);[...$('#prog').children].forEach((d,i)=>{d.style.background=i+1<m?(dk?'rgba(255,255,255,.55)':'rgba(27,26,24,.45)'):i+1===m?'#EE6A1F':(dk?'rgba(255,255,255,.14)':'rgba(27,26,24,.12)')});
  const pl=$('#plab');pl.textContent=m>=1&&m<=7?`MISTAKE ${m}/7`:'';pl.style.color=dk?'#E8D9CC':'#8C877E';op($('#prog'),t<SS.m1-.2?0:(s==='outro'?.6:1))}

// ---------- subtitles: EN karaoke chunks + ID line
const CH=[];WORDS.forEach((s,k)=>{let cur=[];s.words.forEach(([w],i)=>{cur.push(i);const last=i===s.words.length-1,txt=cur.map(j=>s.words[j][0]).join(' ');
  if(last||(/[,.?:;!]$/.test(w)&&cur.length>=2)||cur.length>=7||txt.length>=40){if(!last&&s.words.length-1-i<=1&&cur.length<7){return}CH.push({k,ids:cur});cur=[]}})});
CH.forEach(c=>{c.a=W(c.k,c.ids[0])-.12});CH.forEach((c,i)=>{const nx=CH[i+1];c.b=nx?(nx.k===c.k?nx.a:Math.min(nx.a,WORDS[c.k].e+.9)):WORDS[c.k].e+1.2});
$('#sub').innerHTML=CH.map((c,i)=>`<div class="en" id="en${i}">${c.ids.map(j=>`<span>${WORDS[c.k].words[j][0]}</span>`).join('')}</div>`).join('')+WORDS.map((w,k)=>`<div class="idl" id="id${k}">${w.id}</div>`).join('');
function SUB(t,dk){const ac=dk?'#FFFFFF':'#1B1A18',dim=dk?'rgba(255,255,255,.38)':'rgba(27,26,24,.32)',idc=BGT==='o'?'#FFFFFF':dk?'#F5C9A0':'#9A5A23';
  CH.forEach((c,i)=>{const el=$('#en'+i);const on=t>=c.a&&t<c.b&&t<END-8;if(!sh(el,on))return;const p=P(t,c.a,c.a+.18);el.style.opacity=o3(p).toFixed(3);el.style.transform=`translateY(${((1-o3(p))*14).toFixed(1)}px)`;
    [...el.children].forEach((sp,j)=>{const o=W(c.k,c.ids[j]);sp.style.color=t>=o-.05?ac:dim;sp.style.transform=`translateY(${(t>=o-.05?-3*(1-P(t,o-.05,o+.15)):0).toFixed(1)}px)`})});
  WORDS.forEach((w,k)=>{const el=$('#id'+k);const e=k<N-1?Math.min(ST[k+1],w.e+.9):w.e+1.2;const on=t>=w.s-.1&&t<e&&t<END-8;if(!sh(el,on))return;el.style.color=idc;op(el,P(t,w.s-.1,w.s+.15))})}

// ---------- scene containers
const SC={};SECS.forEach(s=>{const d=document.createElement('div');d.className='sc';d.id='s_'+s;$('#scenes').appendChild(d);SC[s]=d});
const H=(s,h)=>SC[s].insertAdjacentHTML('beforeend',h);
const EXI=HAIR.info;const SRC={m1:'Ch. 6 · Structural model',m2:'Ch. 6 · Model fit',m3:'Ch. 1 · Sample size',m4:'Ch. 4 · Discriminant validity',m5:'Ch. 7 · Mediation',m6:'Ch. 4 · Reliability',m7:'Ch. 6 · Explanatory power'};
function exCard(s,id,key,x,y,w,label){const v=EXI[key],k=(w-40)/v.w;H(s,`<div class="card" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;padding:20px">
  <div class="lab" style="margin-bottom:12px;color:#EE6A1F">${label}</div><div style="position:relative;width:${(w-40)}px;height:${(v.h*k).toFixed(0)}px"><img src="${HAIR[key]}" style="position:absolute;left:0;top:0;width:${w-40}px">
  ${v.lines.map(l=>`<i class="hl" style="position:absolute;left:${(l[0]*k).toFixed(1)}px;top:${(l[1]*k).toFixed(1)}px;width:${(l[2]*k).toFixed(1)}px;height:${(l[3]*k).toFixed(1)}px;background:rgba(238,106,31,.33);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)"></i>`).join('')}</div></div>`)}
function hlAnim(id,t,a){document.querySelectorAll('#'+id+' .hl').forEach((h,i)=>{const s=a+i*.35;h.style.transform=`scaleX(${o3(P(t,s,s+.4)).toFixed(3)})`})}
function myth(s,txt){H(s,`<div class="card" id="my_${s}" style="left:90px;top:120px;width:640px;height:180px;padding:24px 30px"><div class="chip" style="position:relative;display:inline-block;background:#E5463A">MYTH</div>
  <div></div><div class="big" style="position:relative;display:inline-block;font-size:42px;line-height:1.12;margin-top:16px;white-space:nowrap">${txt}<i class="sk" style="position:absolute;left:-6px;right:-6px;top:52%;height:6px;border-radius:3px;background:#E5463A;transform-origin:0 50%;transform:scaleX(0)"></i></div></div>
  <div class="stamp" id="mx_${s}" style="left:540px;top:262px;width:200px;font-size:44px;color:#E5463A;border:6px solid #E5463A;border-radius:14px;background:rgba(255,255,255,.92);padding:2px 0">AVOID</div>
  <div class="card src" id="sr_${s}" style="left:760px;top:120px;width:620px;height:180px;padding:22px 26px;display:flex;gap:22px;align-items:center"><img src="${HAIR.cover}" style="height:136px;border-radius:4px;box-shadow:0 10px 20px -8px rgba(0,0,0,.4)"><div><div class="lab" style="color:#EE6A1F">WHAT THE BOOK SAYS</div><div class="big" style="font-size:30px;line-height:1.15;margin-top:8px">Hair, Hult, Ringle &amp; Sarstedt (2022)</div><div class="mono" style="font-size:20px;color:#8C877E;margin-top:8px">${SRC[s]}</div></div></div>`)}
function mythAnim(s,t,a,x){pop($('#my_'+s),t,a,{dx:-80,dy:0,s0:.9});stampIn($('#mx_'+s),t,x,-10);$('#my_'+s+' .sk').style.transform=`scaleX(${o3(P(t,x-.2,x+.2)).toFixed(3)})`;pop($('#sr_'+s),t,a+.5,{dx:80,dy:0,s0:.9})}
function doCard(s,items,y=470,label='DO THIS INSTEAD'){H(s,`<div class="card" id="do_${s}" style="left:90px;top:${y}px;width:1290px;padding:18px 30px"><div class="chip" style="position:relative;display:inline-block;background:#2E9E5B">${label}</div>
  <div style="display:flex;gap:18px;margin-top:14px">${items.map((it,i)=>`<div class="di" style="flex:1;border-radius:16px;background:#F2EFE9;padding:14px 18px;display:flex;gap:16px;align-items:center"><span style="flex:none;width:52px;height:52px;border-radius:50%;background:#2E9E5B;color:#fff;font-size:32px;line-height:52px;text-align:center">✓</span><span class="big" style="font-size:30px;line-height:1.15">${it}</span></div>`).join('')}</div></div>`)}
function doAnim(s,t,a,step=.35){pop($('#do_'+s),t,a,{dy:60,s0:.92});document.querySelectorAll('#do_'+s+' .di').forEach((d,i)=>pop(d,t,a+.15+i*step,{dy:20,s0:.8}))}

// INTRO
H('intro',`<div class="ab" id="it0" style="left:90px;top:180px;width:1250px"><div class="mono" style="font-size:26px;color:#EE6A1F">PLS-SEM · SMARTPLS</div>
  <div style="font-family:Anton;font-size:190px;line-height:.95;color:#FFFFFF;margin-top:14px">7 PLS-SEM<br><span style="color:#EE6A1F">MISTAKES</span></div></div>
  <div class="ab" id="ic" style="left:860px;top:150px;width:400px;height:518px;perspective:1400px"><img id="icv" src="${HAIR.cover}" style="width:400px;height:518px;border-radius:6px;box-shadow:0 40px 70px -20px rgba(0,0,0,.65)"></div>
  <div class="ab mono" id="icit" style="left:820px;top:690px;width:480px;text-align:center;font-size:20px;color:#BDB6AA">Hair, Hult, Ringle & Sarstedt (2022) · 3rd ed.</div>
  <div class="ab" id="igrid" style="left:90px;top:300px;width:700px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px">${['F-test','GoF','Small n','Fornell-Larcker','Sobel','α 0.97','R² cutoff'].map((m,i)=>`<div class="ig" style="height:120px;border-radius:18px;background:#26231F;border:2px solid rgba(255,255,255,.08);padding:16px"><div style="font-family:Anton;font-size:40px;color:#EE6A1F">0${i+1}</div><div class="big" style="font-size:24px;color:#F2EFE9">${m}</div></div>`).join('')}</div>`);
// M1
myth('m1','Run a simultaneous F-test');
H('m1',`<div class="card" id="ex1a" style="left:90px;top:330px;width:1290px;height:440px;padding:20px;display:flex;gap:30px;align-items:center"><img src="${HAIR.ex61}" style="display:block;height:400px"><div><div class="lab" style="color:#EE6A1F">EXHIBIT 6.1 · STRUCTURAL MODEL ASSESSMENT</div><div class="big" style="font-size:40px;line-height:1.2;margin-top:14px">1 Collinearity<br>2 Path coefficients<br>3 Explanatory power (R²)<br>4 Predictive power</div></div></div>
  <div class="stamp" id="nf1" style="left:860px;top:560px;width:440px;font-size:76px;color:#E5463A;border:10px solid #E5463A;border-radius:20px;background:rgba(255,255,255,.9);line-height:1.05;padding:10px 0">NO F-TEST</div>`);
exCard('m1','ex1b','m1',90,330,1290,'HAIR ET AL. (2022) · CH. 6 · R²');
doCard('m1',['Report R² (combined effect)','Test each path with bootstrapping'],610);
// M2
myth('m2','Report the GoF index');exCard('m2','ex2','m2',90,330,1290,'HAIR ET AL. (2022) · CH. 6');
doCard('m2',['R² (explanatory power)','f² effect size','Predictive power (PLSpredict)'],610,'FOCUS ON');
// M3
myth('m3','Small sample? Use PLS-SEM');exCard('m3','ex3','m3',90,330,1290,'HAIR ET AL. (2022) · CH. 1');
H('m3',`<div class="chip" id="tx3" style="left:90px;top:620px;font-size:26px;background:#8C877E">10× rule = rough guideline only</div>
  <div class="card" id="pw3" style="left:90px;top:330px;width:1290px;padding:24px 34px"><div class="lab">MINIMUM SAMPLE · INVERSE SQUARE ROOT METHOD · 5% SIGNIFICANCE, 80% POWER</div>
   ${[['Weakest path ≈ 0.11–0.20',155,'#EE6A1F'],['Weakest path ≈ 0.31–0.40',39,'#2E9E5B']].map(([a,n,c],i)=>`<div style="display:flex;align-items:center;gap:20px;margin-top:${i?14:18}px"><div class="big" style="width:420px;font-size:30px">${a}</div><div style="flex:1;height:54px;border-radius:27px;background:#F2EFE9;position:relative;overflow:hidden"><i class="bar3" data-n="${n}" style="position:absolute;left:0;top:0;bottom:0;width:0;border-radius:27px;background:${c}"></i></div><div class="big n3" style="width:120px;font-size:44px;text-align:right">0</div></div>`).join('')}
   <div class="mono" style="font-size:18px;color:#8C877E;margin-top:14px">Kock & Hadaya (2018), as presented in Hair et al. (2022), Ch. 1</div></div>
  <div class="chip" id="pi3" style="left:90px;top:640px;font-size:26px;background:#2E9E5B">✓ Pilot study → use its smallest path</div>`);
// M4
myth('m4','Fornell-Larcker is enough');exCard('m4','ex4','m4',90,330,1290,'HAIR ET AL. (2022) · CH. 4');
H('m4',`<div class="card" id="ht4" style="left:90px;top:520px;width:1290px;padding:26px 34px"><div class="chip" style="position:relative;display:inline-block;background:#2E9E5B">USE HTMT</div>
  <div style="position:relative;margin-top:36px;height:70px;border-radius:35px;background:linear-gradient(90deg,#2E9E5B 0%,#2E9E5B 85%,#F0A04B 85%,#F0A04B 90%,#E5463A 90%,#E5463A 100%)"></div>
