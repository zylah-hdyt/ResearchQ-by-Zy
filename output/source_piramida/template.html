<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Piramida Terbalik</title>
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(data:font/woff2;base64,{{INTER500}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,{{INTER600}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(data:font/woff2;base64,{{INTER700}}) format('woff2')}

:root{--bg:#F3F6FA;--paper:#FFFFFF;--ink:#13294B;--muted:#7A879B;--faint:#C3CEDC;--line:#DDE5EF;--acc:#3AA8F0;--accl:#D6ECFB;--dk:#13294B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);transform-origin:0 0}
#pyr{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;transform-origin:1010px 600px}
#pyr .lb{position:absolute;left:0;width:1080px;text-align:center;font-family:PJS;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
#pyr .nm{display:block;font-family:JBM;font-weight:500;font-size:20px;letter-spacing:.14em;margin-bottom:6px}
.pin{position:absolute;width:34px;height:34px;border-radius:50%;background:#3AA8F0;border:5px solid #fff;box-shadow:0 0 0 7px rgba(58,168,240,.25),0 8px 18px -4px rgba(19,41,75,.5)}
.bgl{position:absolute;inset:0}#dots{background-size:38px 38px}#lbl,#ctr{display:none!important}
#blob1{position:absolute;left:-260px;top:260px;width:980px;height:980px;border-radius:50%;background:radial-gradient(circle,rgba(58,168,240,.20),rgba(58,168,240,0) 68%)}
#blob2{position:absolute;left:420px;top:900px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(124,200,248,.22),rgba(124,200,248,0) 68%)}
#kin{position:absolute;left:50px;top:215px;width:980px;height:370px}
.kc{position:absolute;inset:0;display:none;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;text-align:center}
.kw{display:inline-block;margin:0 .13em;font-family:PJS;font-weight:800;font-size:86px;line-height:1.1;letter-spacing:-.035em;will-change:transform}
.kw.em{font-family:IS;font-style:italic;font-weight:400;font-size:110px;letter-spacing:-.01em;line-height:1}
#paper{position:absolute;inset:0;background-image:url({{PAPER}});background-size:512px;mix-blend-mode:multiply;opacity:.06}
#dark{position:absolute;inset:0;background:#13294B;opacity:0}
.ab{position:absolute}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.mono{font-family:JBM,monospace;letter-spacing:.06em}
/* HUD */
#lbl{position:absolute;left:72px;top:200px;font-family:JBM;font-size:24px;color:var(--muted);white-space:nowrap}
#ctr{position:absolute;right:72px;top:200px;font-family:JBM;font-size:24px;color:var(--muted);white-space:nowrap;text-align:right}

/* caption */
.cap{position:absolute;left:72px;top:262px;width:860px;font-size:60px;font-weight:500;line-height:1.1;letter-spacing:-.022em;display:none}
.cap span{display:inline-block;margin-right:.24em;will-change:opacity}
.cap span.em{font-family:IS;font-style:italic;font-weight:400;color:var(--acc);font-size:70px;letter-spacing:-.01em;line-height:.9}
/* building blocks */
.card{position:absolute;background:var(--paper);border-radius:22px;border:2px solid rgba(19,41,75,.08);box-shadow:0 22px 44px -16px rgba(19,41,75,.28),0 2px 0 rgba(0,0,0,.03)}
.dkc{position:absolute;background:var(--dk);color:#F2EFE9;border-radius:24px;box-shadow:0 26px 50px -16px rgba(0,0,0,.45)}
.stamp{position:absolute;left:0;width:1080px;text-align:center;font-family:Anton;font-size:150px;line-height:1;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.stamp i{display:inline-block;font-style:normal}
.stamp i.ac{color:var(--acc)}
.stamp .ul{position:absolute;height:12px;background:var(--acc);border-radius:6px;transform-origin:0 50%}
.chip{position:absolute;padding:12px 24px;border-radius:40px;background:var(--ink);color:#F2EFE9;font-family:JBM;font-size:24px;white-space:nowrap}
.tag{position:absolute;font-family:JBM;font-size:22px;color:var(--muted);white-space:nowrap}
.fico{position:absolute;width:64px;height:78px;border-radius:8px;background:#fff;border:2px solid var(--line)}
.fico:after{content:'';position:absolute;right:-2px;top:-2px;width:20px;height:20px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 0 6px}
svg.dr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.dr path{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.cur{position:absolute;left:0;top:0;width:70px;height:84px;filter:drop-shadow(6px 10px 8px rgba(0,0,0,.35))}
/* mascot */
#mas{position:absolute;left:520px;top:1395px;width:600px;height:584px;transform-origin:50% 100%}
#mas .pz{position:absolute;left:0;top:0;width:600px;display:none}#mas .pz>img{display:block;width:600px}#mas .mo{position:absolute;background-size:100% 100%}
/* brand */
#brand{position:absolute;left:72px;top:1486px;font-family:PJS;font-weight:800;font-size:34px;letter-spacing:-.03em;white-space:nowrap}
#brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-left:3px}
#handle{position:absolute;left:72px;top:1532px;font-family:JBM;font-size:20px;color:var(--muted)}
#ht{position:absolute;left:0;top:0}
#cta{position:absolute;inset:0;display:none}
.pl{position:absolute;left:150px;width:780px;height:120px;border-radius:30px;background:var(--paper);box-shadow:0 20px 40px -12px rgba(0,0,0,.45)}
.pl .n{position:absolute;left:40px;top:22px;font-family:JBM;font-size:22px;color:var(--muted);letter-spacing:.12em}
.pl .h{position:absolute;left:40px;top:52px;font-family:PJS;font-weight:800;font-size:40px;letter-spacing:-.02em;color:var(--ink)}
.pl img{position:absolute;left:30px;top:24px;width:72px;height:72px;object-fit:contain}.pl .n,.pl .h{left:126px!important}
.tile{position:absolute;background:var(--dk);color:#F2EFE9;border-radius:28px;font-family:Anton;text-align:center;box-shadow:0 26px 50px -16px rgba(0,0,0,.45)}
.ln{display:block;height:14px;border-radius:7px;background:#E3DED5}
.row5{position:absolute;left:0;width:860px;height:104px;border-radius:20px;background:var(--paper);border:2px solid rgba(27,26,24,.08);box-shadow:0 14px 30px -14px rgba(60,40,20,.3)}
.num{position:absolute;left:24px;top:22px;width:60px;height:60px;border-radius:50%;background:var(--ink);color:#F2EFE9;font-family:Anton;font-size:34px;line-height:60px;text-align:center}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.06;background-size:1080px 1920px;pointer-events:none}
</style></head>
<body><div id="stage">
<div id="bga" class="bgl"></div><div id="bgb" class="bgl"></div><div id="dots" class="bgl"></div><div id="blob1"></div><div id="blob2"></div><div id="paper"></div><div id="dark"></div>
<div id="scenes"></div>
<div id="pyr"></div>
<canvas id="ht" width="1080" height="1920"></canvas>
<div id="lbl"></div><div id="ctr"></div>
<div id="caps"></div><div id="kin"></div>
<div id="brand">ResearchQ<i></i></div><div id="handle">@researchq.id</div>
<div id="cta"></div>
<div id="mas"></div>
<div id="grain"></div>
</div>
<script>
const WORDS={{WORDS}};      // [{s,e,words:[[w,onset],...]}]
const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};       // {name: dataURI}
const GRAIN={{GRAIN}};const LOGO={{LOGOS}};
const $=s=>document.querySelector(s);
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),o4=x=>1-Math.pow(1-x,4),i3=x=>x*x*x,io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ox=x=>x>=1?1:1-Math.pow(2,-10*x);
const bk=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N=WORDS.length, ST=WORDS.map(w=>w.s), END=WORDS[N-1].e+3.2;
const W=(k,i)=>WORDS[k].words[Math.min(i,WORDS[k].words.length-1)][1];      // onset of word i in sentence k
const SEND=k=>k<N-1?ST[k+1]:END;
function sh(el,on){el.style.display=on?'block':'none';return on}
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
// generic animated element: pop-in at a (bounce), optional exit at b
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.6,r=0,c=false}={}){const p=P(t,a,a+.42),q=P(t,b,b+.2);const e=p>0?bk(p):0;
  el.style.opacity=(cl(p*4)*(1-q)).toFixed(3);el.style.transform=`${c?'translate(-50%,-50%) ':''}translate(${((1-o3(p))*dx).toFixed(1)}px,${((1-o3(p))*dy).toFixed(1)}px) rotate(${(r*(1-o3(p))).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`}
// stamp text: letters drop in one by one; accent letters slam
function mkStamp(id,words,top,size=150){const el=document.createElement('div');el.className='stamp';el.id=id;el.style.top=top+'px';el.style.fontSize=size+'px';
  el.innerHTML=words.map(([w,ac])=>`<span style="position:relative;display:inline-block;margin:0 .12em">${[...w].map(ch=>`<i class="${ac?'ac':''}">${ch===' '?'&nbsp;':ch}</i>`).join('')}${ac?'<b class="ul" style="left:0;right:0;bottom:-6px"></b>':''}</span>`).join('');return el}
function stamp(el,t,a,b=1e9){const ls=[...el.querySelectorAll('i')];let k=0;ls.forEach((l,i)=>{const s=a+i*.032,p=P(t,s,s+.26),e=p>0?bk(p,2.2):0,ac=l.classList.contains('ac');
    l.style.opacity=(cl(p*5)).toFixed(3);l.style.transform=`translateY(${((1-e)*(ac?-160:-90)).toFixed(1)}px) rotate(${((1-o3(p))*(i%2?16:-14)).toFixed(2)}deg) scale(${(1+(ac?.6:.3)*(1-o3(p))).toFixed(3)})`});
  el.querySelectorAll('.ul').forEach(u=>{u.style.transform=`scaleX(${o4(P(t,a+ls.length*.032,a+ls.length*.032+.3)).toFixed(3)})`});
  const q=P(t,b,b+.18);el.style.opacity=(1-q).toFixed(3);el.style.transform=`scale(${(1-.08*q).toFixed(3)})`}
// hand-drawn loop around a box
function loopPath(x,y,w,h,seed){const r=rng(seed),cx=x+w/2,cy=y+h/2;let d='';for(let i=0;i<=34;i++){const a=-1.9+i/34*2*Math.PI*1.08,j=1+(r()-.5)*.07;const px=cx+Math.cos(a)*w/2*j,py=cy+Math.sin(a)*h/2*j;d+=(i?' L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
function mkDraw(parent,d,w=7){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','dr');s.setAttribute('width','1080');s.setAttribute('height','1920');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.style.strokeWidth=w;s.appendChild(p);parent.appendChild(s);const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;p.dataset.l=l;return p}
function rrPath(x,y,w,h,r){return `M${x+r} ${y} H${x+w-r} A${r} ${r} 0 0 1 ${x+w} ${y+r} V${y+h-r} A${r} ${r} 0 0 1 ${x+w-r} ${y+h} H${x+r} A${r} ${r} 0 0 1 ${x} ${y+h-r} V${y+r} A${r} ${r} 0 0 1 ${x+r} ${y} Z`}
function mkBox(k,get,pad=14,r=24,w=5,gx=null){const p=mkDraw(SC[k],'M0 0',w);p._box={k,get,pad,r,gx};return p}
function bb(k,els){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const e of els){let x=0,y=0,n=e;while(n&&n!==SC[k]){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}
    x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+e.offsetWidth);y1=Math.max(y1,y+e.offsetHeight)}return [x0,y0,x1,y1]}
function boxInit(p){if(p._done)return;const {k,get,pad,r,gx}=p._box;let [x0,y0,x1,y1]=bb(k,get());if(gx){const q=bb(k,gx());x0=q[0];x1=q[2]}
  if(!(x1>x0))return;p.setAttribute('d',rrPath(x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad,r));const l=p.getTotalLength();p.style.strokeDasharray=l;p.dataset.l=l;p._done=1}
function draw(p,t,a,dur=.35){if(p._box)boxInit(p);p.style.strokeDashoffset=(+p.dataset.l*(1-o3(P(t,a,a+dur)))).toFixed(1)}
const CUR='<svg viewBox="0 0 46 56" width="70" height="84"><path d="M4 3 L4 44 L15 34 L23 52 L31 48 L23 31 L39 31 Z" fill="#1B1A18" stroke="#FBF7F0" stroke-width="3" stroke-linejoin="round"/></svg>';

// ---------- scene backgrounds (per sentence) + dark flags
const BG=['#13294B','#F3F6FA','#F3F6FA','#D6ECFB','#FFFFFF','#FFFFFF','#CFE7FA','#F5F9FD','#F5F9FD','#F5F9FD','#13294B','#E6F2FC'];
const isDk=c=>c==='#13294B';
function BGF(t){let k=0;for(let i=0;i<N;i++)if(t>=ST[i]-.25)k=i;const prev=BG[Math.max(0,k-1)],cur=BG[k];const p=k?o3(P(t,ST[k]-.25,ST[k]+.3)):1;
  $('#bga').style.background=prev;const b=$('#bgb');b.style.background=cur;b.style.clipPath=`circle(${(p*2300).toFixed(1)}px at 540px 900px)`;
  const dk=isDk(p>.5?cur:prev);const g=$('#dots');g.style.opacity=dk?.55:1;g.style.backgroundImage=`radial-gradient(circle, ${dk?'rgba(255,255,255,.10)':'rgba(19,41,75,.10)'} 1.7px, transparent 2px)`;
  g.style.backgroundPosition=`${(t*6).toFixed(1)}px ${(t*10).toFixed(1)}px`;
  $('#blob1').style.transform=`translate(${(60*Math.sin(t*.35)).toFixed(1)}px,${(40*Math.cos(t*.3)).toFixed(1)}px)`;$('#blob2').style.transform=`translate(${(-50*Math.sin(t*.28)).toFixed(1)}px,${(60*Math.sin(t*.22)).toFixed(1)}px)`;
  op($('#blob1'),dk?.5:1);op($('#blob2'),dk?.45:1);return dk?1:0}

// ---------- kinetic captions: 1-3 word chunks, words land as they are spoken
const EMS=[["piramida","terbalik"],["luas,"],["mengerucut","masalah"],["film."],["konflik","memperkenalkan"],["situasinya,","cerita","utama."],["latar","belakang"],["fenomena","umum,"],["spesifik,"],["masalah","fokus","penelitian."],["gambaran","besarnya"],["umum","khusus."]];
const CH=[];WORDS.forEach((s,k)=>{let cur=[];s.words.forEach(([w],i)=>{cur.push(i);const txt=cur.map(j=>s.words[j][0]).join(' ');
  const last=i===s.words.length-1,rem=s.words.length-1-i;if(last||/[,.?:;!]$/.test(w)||cur.length>=3||txt.length>=17){if(rem===1&&!/[,.?:;!]$/.test(w)&&cur.length<3)return;CH.push({k,ids:cur});cur=[]}})});
CH.forEach((c,i)=>{c.a=W(c.k,c.ids[0])-.1;c.v=i%4});CH.forEach((c,i)=>{c.b=i<CH.length-1?CH[i+1].a:END});
$('#kin').innerHTML=CH.map((c,i)=>`<div class="kc" id="kc${i}">${c.ids.map(j=>{const w=WORDS[c.k].words[j][0];return `<span class="kw${EMS[c.k].includes(w)?' em':''}">${w}</span>`}).join('')}</div>`).join('');
function CAP(t,dk){CH.forEach((c,i)=>{const el=$('#kc'+i);const on=t>=c.a-.05&&t<c.b&&t<END-2.75;if(!sh(el,on))return;el.style.display='flex';
  const q=P(t,c.b-.13,c.b);el.style.opacity=(1-q).toFixed(3);el.style.transform=`translateY(${(-60*o3(q)).toFixed(1)}px) scale(${(1-.06*q).toFixed(3)})`;
  [...el.children].forEach((sp,j)=>{const o=W(c.k,c.ids[j]),p=P(t,o-.07,o+.23),e=o4(p),b=p>0?bk(p,1.4):0;let tr='',f='none';
    if(c.v===0)tr=`translateY(${((1-e)*70).toFixed(1)}px) rotate(${((1-e)*6).toFixed(2)}deg)`;
    else if(c.v===1){tr=`scale(${(1.6-.6*b).toFixed(3)})`;f=`blur(${((1-e)*12).toFixed(1)}px)`}
    else if(c.v===2)tr=`translateX(${((1-e)*90).toFixed(1)}px)`;
    else tr=`translateY(${((1-b)*-60).toFixed(1)}px)`;
    const em=sp.classList.contains('em');if(em)tr+=` scale(${(1+.08*Math.sin(Math.PI*P(t,o+.15,o+.5))).toFixed(3)})`;
    sp.style.opacity=cl(p*2.5).toFixed(3);sp.style.transform=tr;sp.style.filter=f;sp.style.color=em?(dk?'#7CC8F8':'#2E9BE6'):(dk?'#FFFFFF':'#13294B')})})}
const POSE=['m_think','m_point','m_open','m_point','m_open','m_thumb','m_point','m_point','m_open','m_thumb','m_warn','m_point'];
const SC=[];for(let k=0;k<N;k++){const d=document.createElement('div');d.className='sc';d.id='s'+k;$('#scenes').appendChild(d);SC.push(d)}
function H(k,html){SC[k].insertAdjacentHTML('beforeend',html)}
const lines=(n,ws,gap=22,col='#DDE5EF')=>Array.from({length:n},(_,i)=>`<i style="display:block;height:14px;border-radius:7px;width:${ws[i%ws.length]}%;margin-top:${i?gap:0}px;background:${col}"></i>`).join('');

// S0 hook (navy): glowing triangle + preview layers
H(0,`<div class="chip" id="ch0" style="left:72px;top:610px;background:#3AA8F0;color:#13294B">PENELITIAN KUANTITATIF</div>
  ${[0,1,2].map(i=>`<i class="ab pv0" style="left:${540-(300-i*95)}px;top:${830+i*80}px;width:${2*(300-i*95)}px;height:6px;border-radius:3px;background:rgba(124,200,248,.55)"></i>`).join('')}
  <div class="ab" id="qm0" style="left:820px;top:640px;font-family:IS;font-style:italic;font-size:200px;color:#7CC8F8">?</div>`);
SC[0].appendChild(mkStamp('st0',[['PIRAMIDA',0],['TERBALIK',1]],1150,112));$('#st0').style.color='#FFFFFF';

// S1+S2 broad -> narrow funnel
H(1,`<div class="ab" id="br1" style="left:70px;top:620px;width:940px;height:100px;border-radius:24px;background:linear-gradient(90deg,#BFE3FB,#D6ECFB,#BFE3FB);box-shadow:0 18px 36px -18px rgba(19,41,75,.35);transform-origin:50% 50%"><div class="ab" style="left:0;width:940px;top:22px;text-align:center;font-family:Anton;font-size:56px;color:var(--ink);letter-spacing:.06em">LUAS</div></div>
  ${[0,1,2].map(i=>`<div class="ab nb1" style="left:${540-(330-i*95)}px;top:${770+i*115}px;width:${2*(330-i*95)}px;height:70px;border-radius:16px;background:rgba(58,168,240,${(.10+i*.07).toFixed(2)});border:2px solid rgba(58,168,240,.35)"></div>`).join('')}
  <div class="ab" id="tg1" style="left:470px;top:1130px;width:140px;height:140px;border-radius:50%;background:var(--ink);box-shadow:0 16px 30px -10px rgba(19,41,75,.55)"><i class="ab" style="left:46px;top:46px;width:48px;height:48px;border-radius:50%;background:var(--acc)"></i></div>
  <div class="ab" id="tl1" style="left:640px;top:1172px;font-family:Anton;font-size:46px;color:var(--ink);letter-spacing:.04em">MASALAH</div>
  <i class="ab" id="rg1" style="left:470px;top:1130px;width:140px;height:140px;border-radius:50%;border:4px solid var(--acc)"></i>`);

// S3 clapperboard (light-blue bg)
