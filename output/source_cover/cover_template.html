<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'PJS';font-weight:800;src:url(data:font/woff2;base64,{{PJS800}}) format('woff2')}
@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,{{JBM500}}) format('woff2')}
@font-face{font-family:'IS';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,{{IS400I}}) format('woff2')}
:root{--acc:#E8672A;--amb:#F4A340;--cream:#F1E8D8;--char:#141110}
*{box-sizing:border-box}html,body{margin:0;background:#141110}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:PJS;color:var(--cream);background:radial-gradient(ellipse 80% 50% at 50% 42%,#2E221A 0%,#171311 60%,#0B0908 100%)}
.ab{position:absolute}.ctr{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
#glow{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 48% 22% at 50% 41%,rgba(232,103,42,.38),transparent 72%)}
#brand{left:72px;top:282px;font-size:46px;font-weight:800;letter-spacing:-.03em}
#brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--acc);margin-left:4px}
#tag{left:50%;top:410px;transform:translateX(-50%) rotate(-2.5deg);background:var(--acc);color:#141110;font-size:104px;font-weight:800;letter-spacing:-.035em;line-height:1;padding:22px 44px 26px;border-radius:14px;white-space:nowrap;box-shadow:0 30px 60px -16px rgba(0,0,0,.7)}
#zero{top:520px;font-size:520px;font-weight:800;letter-spacing:-.065em;line-height:1;color:var(--acc);text-shadow:0 0 80px rgba(232,103,42,.55),0 0 200px rgba(232,103,42,.3)}
#q{top:1050px;font-size:158px;font-weight:800;letter-spacing:-.045em;line-height:1;text-shadow:0 18px 40px rgba(0,0,0,.6)}
#q b{color:var(--acc)}
#sw{left:170px;top:1218px;width:740px;height:50px}
.card{left:240px;top:1300px;width:600px;height:250px;border-radius:28px;background:linear-gradient(155deg,#2F251E,#1A1512);border:1.5px solid rgba(241,232,216,.14);box-shadow:0 50px 90px -20px rgba(0,0,0,.8);transform:rotate(3deg)}
.card .l{position:absolute;left:38px;top:32px;font-family:JBM;font-size:20px;letter-spacing:.16em;color:rgba(241,232,216,.55)}
.card .l i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-right:12px}
.card .t{position:absolute;left:38px;top:84px;font-size:64px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.card .t span{color:var(--amb)}
#st{left:300px;top:1388px;width:500px;height:150px;transform:rotate(-9deg);border-radius:10px;background:#F0E5D2;box-shadow:0 24px 44px rgba(0,0,0,.55)}
#st .b1{position:absolute;inset:13px;border:6px solid var(--acc);border-radius:6px}
#st .b2{position:absolute;inset:25px;border:2px solid var(--acc);border-radius:3px;opacity:.8}
#st .x{position:absolute;left:0;top:47px;width:500px;text-align:center;font-size:56px;font-weight:800;color:var(--acc);white-space:nowrap}
#st svg{position:absolute;left:0;top:0}
#tl{top:1606px;font-family:IS;font-style:italic;font-size:70px;color:var(--cream);opacity:.9}
#grain{left:0;top:0;width:1080px;height:1920px;background:url({{GRAIN}});background-size:1080px 1920px;mix-blend-mode:overlay;opacity:.12}
#vig{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 75% 60% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
</style></head><body><div id="c">
<div class="ab" id="glow"></div>
<div class="ab" id="brand">ResearchQ<i></i></div>
<div class="ab" id="tag">AI DETECTOR</div>
<div class="ctr" id="zero">0%</div>
<div class="ctr" id="q">EMANG BISA<b>?</b></div>
<svg class="ab" id="sw" viewBox="0 0 740 50"><path d="M10 32 C 180 8, 420 6, 730 24" fill="none" stroke="#E8672A" stroke-width="12" stroke-linecap="round"/></svg>
<div class="ab card"><div class="l"><i></i>PROMO SKILL</div><div class="t">LOLOS <span>TURNITIN?</span></div></div>
<div class="ab" id="st"><div class="b1"></div><div class="b2"></div><div class="x">DIJAMIN LOLOS</div>
<svg width="500" height="150" viewBox="0 0 500 150"><g fill="none" stroke="#1B1714" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M290 80 L322 58 L350 66 L388 34 L420 30 L470 4"/><path d="M290 80 L318 102 L310 128 L336 150"/><path d="M290 80 L250 92 L214 84 L176 108 L120 112 L60 140"/><path d="M290 80 L268 52 L274 22 L248 0"/><path d="M290 80 L360 104 L410 98 L500 120"/></g></svg></div>
<div class="ctr" id="tl">jangan gampang percaya.</div>
<div class="ab" id="grain"></div><div class="ab" id="vig"></div>
</div></body></html>
