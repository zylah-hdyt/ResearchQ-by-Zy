 text-shadow:3px 0 0 #0B1630,-3px 0 0 #0B1630,0 3px 0 #0B1630,0 -3px 0 #0B1630,2px 2px 0 #0B1630,-2px 2px 0 #0B1630,2px -2px 0 #0B1630,-2px -2px 0 #0B1630,0 10px 24px rgba(0,0,0,.45)}

</style></head><body><div id="stage">
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="topg"></div><div id="pbd"></div>
<div id="vis"></div>

<script>
const SENT={{WORDS}};const GRAIN={{GRAIN}};const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};const MEDIA={{MEDIA}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,iosin=x=>.5-.5*Math.cos(Math.PI*x),bk=(x,s=1.3)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const N=SENT.length,END=SENT[N-1].e+1.6;
const FW=(k,nd,occ=0)=>{const ws=SENT[k].words;let c=0;for(const w of ws){if(w[0].toLowerCase().replace(/[^a-z0-9]/g,'').includes(nd.toLowerCase())){if(c===occ)return w[1];c++}}return SENT[k].s};
const SS=k=>SENT[k].s,SE=k=>SENT[k].e;
function op(el,v){el.style.opacity=cl(v).toFixed(3)}
function pop(el,t,a,{b=1e9,dx=0,dy=40,s0=.9,d=.5,bl=0}={}){if(!el)return;const p=P(t,a,a+d),q=P(t,b,b+.3),e=p>0?o3(p):0;
  el.style.opacity=(cl(p*2.2)*(1-q)).toFixed(3);el.style.visibility=(p<=0||q>=1)?'hidden':'visible';
  el.style.transform=`translate(${((1-e)*dx).toFixed(1)}px,${((1-e)*dy-q*16).toFixed(1)}px) scale(${(s0+(1-s0)*(p>0?bk(p,1.1):0)).toFixed(4)})`;
  el.style.filter=bl?`blur(${((1-e)*bl+q*8).toFixed(1)}px)`:''}
const V=$('#vis');const add=h=>V.insertAdjacentHTML('beforeend',h);

// =============== B-ROLL ENGINE (WebGL2: depth parallax, DOF, whip, grade, grain, leak, split) ===============
const cv=$('#gl'),gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const VS=`#version 300 es
in vec2 p;out vec2 vUv;void main(){vUv=vec2(p.x*.5+.5,1.-(p.y*.5+.5));gl_Position=vec4(p,0,1);}`;
const FS=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform sampler2D tA,dA,tB,dB;uniform vec4 camA,camB,pA,pB,gA,gB;uniform vec3 shA,shB,hiA,hiB;uniform vec2 whA,whB;
uniform float mixAB,split,splitY,time,grain,vig,leak,leakX;
vec3 shot(sampler2D t,sampler2D d,vec2 uv,float pa,vec4 cam,vec4 p,vec2 wh){
  vec2 s=vec2(min(1.,pa/cam.w),min(1.,cam.w/pa));vec2 u=(uv-.5)*s/cam.z+cam.xy;
  float dd=texture(d,u).r;u+=p.xy*(dd-p.z);dd=texture(d,u).r;u=p.xy*(dd-p.z)+(uv-.5)*s/cam.z+cam.xy;
  float r=p.w*abs(dd-p.z)*.012;vec3 c=vec3(0.);
  for(int i=0;i<12;i++){float fi=float(i);float an=fi*2.39996;float rad=sqrt((fi+.5)/12.)*r;vec2 off=vec2(cos(an)/cam.w,sin(an))*rad+wh*(fi/11.-.5);c+=texture(t,clamp(u+off,.001,.999)).rgb;}
  return c/12.;}
vec3 grade(vec3 c,vec4 g,vec3 sh,vec3 hi){c=pow(max(c,0.),vec3(1./2.2));c=pow(c,vec3(2.2));c*=g.x;float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,g.y);
  c=(c-.45)*g.z+.45;c=max(c,0.);l=clamp(dot(c,vec3(.2126,.7152,.0722)),0.,1.);c=c*mix(vec3(1.),hi,l)+sh*(1.-l)*(1.-l);c=g.w+c*(1.-g.w);return c;}
float hash(vec2 q){return fract(sin(dot(q,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 uv=vUv;vec3 c;
  if(split>.5){ if(uv.y<splitY){vec2 u=vec2(uv.x,uv.y/splitY);c=grade(shot(tA,dA,u,1080./(1920.*splitY),camA,pA,whA),gA,shA,hiA);}
               else{vec2 u=vec2(uv.x,(uv.y-splitY)/(1.-splitY));c=grade(shot(tB,dB,u,1080./(1920.*(1.-splitY)),camB,pB,whB),gB,shB,hiB);} }
  else{ vec3 a=mixAB<.999?grade(shot(tA,dA,uv,.5625,camA,pA,whA),gA,shA,hiA):vec3(0.);vec3 b=mixAB>.001?grade(shot(tB,dB,uv,.5625,camB,pB,whB),gB,shB,hiB):vec3(0.);c=mix(a,b,mixAB);}
  vec2 q=uv-vec2(leakX,.25);c+=leak*vec3(1.,.55,.18)*exp(-dot(q*vec2(1.,.6),q*vec2(1.,.6))*5.);
  float v=length((uv-.5)*vec2(1.,.75))*1.35;c*=1.-vig*pow(v,2.4);
  c+=(hash(uv*vec2(1080.,1920.)+fract(time*7.31)*91.)-.5)*grain;
  o=vec4(clamp(c,0.,1.),1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U={};['tA','dA','tB','dB','camA','camB','pA','pB','gA','gB','shA','shB','hiA','hiB','whA','whB','mixAB','split','splitY','time','grain','vig','leak','leakX'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
gl.uniform1i(U.tA,0);gl.uniform1i(U.dA,1);gl.uniform1i(U.tB,2);gl.uniform1i(U.dB,3);
const TEX={};
function mkTex(img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
const ld=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
window.READY=Promise.all(Object.entries(MEDIA).map(async([k,v])=>{const [im,dm]=await Promise.all([ld(v.img),ld(v.dep)]);TEX[k]={t:mkTex(im),d:mkTex(dm),ar:im.width/im.height}}));

// grades: [expo,sat,contrast,fade], shadow tint, highlight tint
const GR={dark:[[.58,.55,1.3,.01],[.008,.02,.06],[.9,.97,1.1]],
  warm:[[.94,.84,1.06,.03],[.06,.04,.018],[1.10,1.0,.80]],
  warmbw:[[1.02,.0,1.0,.06],[.06,.04,.02],[1.08,1.0,.84]],
  modern:[[1.06,1.02,1.06,.0],[.0,.03,.075],[.99,1.0,1.04]],
  night:[[.42,.55,1.35,.0],[.006,.018,.05],[.9,.97,1.12]],
  dusk:[[.5,.8,1.15,.01],[.03,.022,.04],[1.06,.96,.82]],
  cool:[[.72,.7,1.15,.01],[.0,.025,.07],[.93,.98,1.08]]};
// ---------- shot list (filled after word timing is known)
let SH=[];
function camOf(s,t){const p=cl((t-s.a)/(s.b-s.a),-.3,1.35),e=L(p,iosin(cl(p)),.35);const z=L(s.z[0],s.z[1],e);const c0=s.c?s.c[0]:[.5,.5],c1=s.c?s.c[1]:c0;
  return {cx:L(c0[0],c1[0],e),cy:L(c0[1],c1[1],e),z,px:(s.par||[0,0])[0]*(e*2-1),py:(s.par||[0,0])[1]*(e*2-1)}}
function bindShot(slot,s,t,extra={}){const T=TEX[s.n];const c=camOf(s,t);gl.activeTexture(gl.TEXTURE0+slot*2);gl.bindTexture(gl.TEXTURE_2D,T.t);gl.activeTexture(gl.TEXTURE1+slot*2);gl.bindTexture(gl.TEXTURE_2D,T.d);
  const pa=extra.pa||.5625,sx=Math.min(1,pa/T.ar)/c.z*.5,sy=Math.min(1,T.ar/pa)/c.z*.5;const cx=cl(c.cx+(extra.dx||0),sx+.012,1-sx-.012),cy=cl(c.cy,sy+.012,1-sy-.012);
  const g=GR[s.g||'modern'],X=slot?'B':'A';gl.uniform4f(U['cam'+X],cx,cy,c.z,T.ar);gl.uniform4f(U['p'+X],c.px,c.py,s.f==null?.55:s.f,s.dof||0);
  gl.uniform4f(U['g'+X],...g[0]);gl.uniform3f(U['sh'+X],...g[1]);gl.uniform3f(U['hi'+X],...g[2]);gl.uniform2f(U['wh'+X],extra.wh||0,0)}
function BROLL(t){let i=0;for(let k=0;k<SH.length;k++)if(t>=SH[k].a)i=k;const s=SH[i],pr=SH[Math.max(0,i-1)];
  gl.uniform1f(U.time,t);gl.uniform1f(U.grain,s.g==='warm'||s.g==='warmbw'?.075:.05);gl.uniform1f(U.vig,(s.g==='dark'||s.g==='night')?.95:s.g==='modern'?.45:.7);
  const lk=(s.g==='warm'||s.g==='warmbw')?(.10+.06*Math.sin(t*1.7))*P(t,s.a,s.a+.6):0;gl.uniform1f(U.leak,lk);gl.uniform1f(U.leakX,.15+.7*((t*.08)%1));
  if(s.split){const sy=L(1,.5,io3(P(t,s.a+.05,s.a+.65)));const sy2=L(sy,.5,0);const syy=s.split2?L(.5,.5,0):sy;
    const yB=t<s.sb?L(1,.5,io3(P(t,s.sb-.6,s.sb))):.5; // bottom panel slides up when "sekarang" starts
    gl.uniform1f(U.split,1);gl.uniform1f(U.splitY,Math.max(.5,yB));bindShot(0,{...s,n:s.n,g:s.g},t,{pa:1080/(1920*Math.max(.5,yB))});bindShot(1,{...s,n:s.n2,g:s.g2,c:s.c2,z:s.z2,par:s.par2},t,{pa:1080/(1920*(1-Math.max(.5,yB)+1e-3))});
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);const d=$('#sdiv');d.style.top=(Math.max(.5,yB)*1920-3).toFixed(0)+'px';op(d,yB<.995?1:0);return}
  $('#sdiv').style.opacity=0;gl.uniform1f(U.split,0);const td=s.td||(s.tr==='whip'?.42:s.tr==='fade'?.6:s.tr==='flash'?.5:0);
  if(i>0&&td>0&&t<s.a+td){const e=P(t,s.a,s.a+td);
    if(s.tr==='whip'){const k=io3(e),bl=Math.sin(Math.PI*e)*.085*(s.dir||1);bindShot(0,pr,t,{dx:k*.12*(s.dir||1),wh:bl});bindShot(1,s,t,{dx:-(1-k)*.12*(s.dir||1),wh:bl});gl.uniform1f(U.mixAB,cl((e-.35)/.3))}
    else{bindShot(0,pr,t);bindShot(1,s,t);gl.uniform1f(U.mixAB,iosin(e))}}
  else{bindShot(0,s,t);bindShot(1,s,t);gl.uniform1f(U.mixAB,1)}
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  // flash for 'flash' transitions and hard accents
  let fl=0;for(const x of SH){if(x.tr==='flash'){fl=Math.max(fl,Math.max(0,1-Math.abs(t-x.a-.04)/.22))}}$('#flash').style.opacity=(fl*.85).toFixed(3)}

// =============== GRAPHIC BACKGROUNDS (motion-graphic scenes: night / paper / modern) ===============
(function(){const st=$('#stage'),gl0=$('#gl');gl0.insertAdjacentHTML('afterend',`<div id="gbg">
 <div class="gt" id="g_night"></div><div class="gt" id="g_paper"><div id="g_ptex"></div></div><div class="gt" id="g_modern"><div id="g_grid"></div></div>
 <div class="orb" id="ob1"></div><div class="orb" id="ob2"></div><div id="gdust">${Array.from({length:46},(_,i)=>`<i data-i="${i}"></i>`).join('')}</div><div id="ggrain"></div></div>`)})();
let GW=[];
function GBG(t){let vis={night:0,paper:0,modern:0};for(const [a,b,th] of GW){const v=Math.min(P(t,a-.02,a+.32),1-P(t,b-.02,b+.3));vis[th]=Math.max(vis[th],v)}
  const tot=Math.max(vis.night,vis.paper,vis.modern);op($('#gbg'),tot);if(tot<=0)return 0;
  const sum=vis.night+vis.paper+vis.modern||1;op($('#g_night'),vis.night/sum*1.0+(vis.night>0?.0:0));op($('#g_paper'),vis.paper/sum);op($('#g_modern'),vis.modern/sum);
  const warm=vis.paper/sum;$('#ob1').style.background=warm>.5?'radial-gradient(circle,rgba(255,170,70,.32),rgba(255,170,70,0) 65%)':'radial-gradient(circle,rgba(61,139,255,.34),rgba(61,139,255,0) 65%)';
  $('#ob2').style.background=warm>.5?'radial-gradient(circle,rgba(255,214,140,.22),rgba(255,214,140,0) 65%)':'radial-gradient(circle,rgba(120,180,255,.22),rgba(120,180,255,0) 65%)';
  $('#ob1').style.transform=`translate(${(180*Math.sin(t*.21)).toFixed(1)}px,${(140*Math.cos(t*.17)).toFixed(1)}px)`;$('#ob2').style.transform=`translate(${(-160*Math.cos(t*.19)).toFixed(1)}px,${(120*Math.sin(t*.23)).toFixed(1)}px)`;
  $('#g_grid').style.backgroundPosition=`0px ${((t*40)%120).toFixed(1)}px`;$('#g_ptex').style.backgroundPosition=`${((t*6)%512).toFixed(1)}px 0px`;
  $$('#gdust i').forEach(d=>{const i=+d.dataset.i,z=i%3,x=(hsh(i)*1180-50+Math.sin(t*.4+i)*24),y=((hsh(i+70)*2000-t*[10,18,30][z])%2000+2000)%2000-40;d.style.left=x.toFixed(1)+'px';d.style.top=y.toFixed(1)+'px';d.style.opacity=((.25+.5*(.5+.5*Math.sin(t*.9+i)))*(warm>.5?1:.8)).toFixed(2);d.style.background=warm>.5?'rgba(255,214,150,.9)':'rgba(170,205,255,.9)'});
  $('#ggrain').style.backgroundImage=`url(${GRAIN[Math.floor(t*24)%GRAIN.length]})`;return tot}
