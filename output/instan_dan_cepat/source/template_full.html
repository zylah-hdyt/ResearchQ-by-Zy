<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Instan dan Cepat (full motion)</title>
<style>
@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,{{INTER600}}) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(data:font/woff2;base64,{{INTER700}}) format('woff2')}
@font-face{font-family:'PJS';font-weight:800;src:url(data:font/woff2;base64,{{PJS800}}) format('woff2')}
@font-face{font-family:'ISerif';font-style:italic;src:url(data:font/woff2;base64,{{ISERIF}}) format('woff2')}
@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,{{JBM500}}) format('woff2')}
*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B1630;font-family:Inter,sans-serif;color:#fff}
#scenes{position:absolute;inset:0;z-index:0;isolation:isolate}
#mshadow,#mas{z-index:5}#sub{z-index:6}#flash{z-index:7}#wm{z-index:8}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none;transform-origin:540px 960px}
.bg,.cam{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cam{transform-origin:540px 860px}
.ab{position:absolute}
.T{position:absolute;left:0;width:1080px;text-align:center;font-family:PJS;font-weight:800;letter-spacing:-.04em;line-height:.92;white-space:nowrap}
.S{font-family:ISerif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.L{position:absolute;left:0;width:1080px;text-align:center;font-family:Inter;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.sh{text-shadow:0 10px 40px rgba(0,0,0,.45)}
.ico{position:absolute}
.dot{position:absolute;border-radius:50%}
#sub{position:absolute;left:50px;top:1380px;width:980px;text-align:center;pointer-events:none}
#sub .cue{position:absolute;left:0;top:0;width:980px;text-align:center;display:none}
#sub span{display:inline-block;margin:0 .12em;font-family:PJS;font-weight:800;font-size:54px;line-height:1.18;letter-spacing:-.015em;white-space:nowrap;color:var(--sc,#fff);text-shadow:var(--so)}
#sub span.k{color:var(--sk,#FFD36B);font-size:60px}
#mas{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#mas .pz{position:absolute;display:none}#mas .mo{position:absolute;background-size:100% 100%}
#mshadow{position:absolute;width:760px;height:120px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#wm{position:absolute;left:56px;top:1850px;font-family:PJS;font-weight:800;font-size:28px;color:rgba(255,255,255,.75)}
#wm i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF9F43;margin-left:3px}
svg.ov{position:absolute;left:0;top:0;overflow:visible}path.dp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tt{position:relative;height:300px;border-radius:18px;overflow:hidden}.tt i{position:absolute;left:50%;top:40%;margin:-22px 0 0 -16px;border-left:36px solid rgba(255,255,255,.9);border-top:22px solid transparent;border-bottom:22px solid transparent}
.tt span{position:absolute;left:14px;bottom:44px;font-family:PJS;font-weight:800;font-size:32px;color:#fff}.tt em{position:absolute;left:14px;bottom:12px;font-style:normal;font-size:22px;font-weight:700;color:rgba(255,255,255,.9)}
.pill{position:absolute;padding:14px 28px;border-radius:40px;font-family:PJS;font-weight:800;white-space:nowrap}
.yrow{display:flex;gap:22px;padding:18px 30px;align-items:flex-start}.yrow img{width:560px;height:315px;border-radius:20px;object-fit:cover;flex:none}
.yrow div{font-family:Inter;font-weight:700;font-size:36px;line-height:1.22;color:#F1F1F1}.yrow small{display:block;margin-top:10px;font-size:26px;color:#AAA;font-weight:600}
.lc{font-size:36px;line-height:1.3;color:#fff;margin:0 160px 14px 34px;text-shadow:0 2px 8px rgba(0,0,0,.7);font-weight:600}.lc b{color:#FFD36B;margin-right:10px}
</style></head><body><div id="stage">
<div id="scenes"></div>
<div id="mshadow"></div>
<div id="mas"></div>
<div id="sub"></div>
<div id="flash"></div>
<div id="wm">ResearchQ<i></i></div>
</div>
<script>
const SENT={{WORDS}};const MAS={{MASCOT}};const MO={{MOUTHS}};const MI={{MOUTHINFO}};const LIP={{LIP}};const PH={{PHOTOS}};const AIL={{AILOGOS}};const YTT={{YTTHUMBS}};const GRAIN={{GRAIN}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,p)=>a+(b-a)*p;
const o3=x=>1-Math.pow(1-x,3),o5=x=>1-Math.pow(1-x,5),io3=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,bk=(x,s=1.4)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const hsh=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const N=SENT.length,END=SENT[N-1].e+1.6;
const FW=(k,nd,occ=0)=>{const ws=SENT[k].words;let c=0;for(const w of ws){if(w[0].toLowerCase().replace(/[^a-z0-9]/g,'').includes(nd.toLowerCase())){if(c===occ)return w[1];c++}}return SENT[k].s};
const SS=k=>SENT[k].s,SE=k=>SENT[k].e;
function op(el,v){if(el)el.style.opacity=cl(v).toFixed(3)}
// element entrances: pop (scale+rise), slam (big->1), sl (slide from side); all fade out at b
function A(el,t,a,{b=1e9,dx=0,dy=70,s0=.6,d=.45,r=0,blur=0}={}){if(!el)return;const p=P(t,a,a+d),q=P(t,b,b+.2),e=p>0?bk(p,1.3):0,e2=o3(p);
  el.style.opacity=(cl(p*3)*(1-q)).toFixed(3);el.style.visibility=(p<=0||q>=1)?'hidden':'visible';
  el.style.transform=`translate(${((1-e2)*dx).toFixed(1)}px,${((1-e2)*dy-q*40).toFixed(1)}px) rotate(${((1-e2)*r).toFixed(2)}deg) scale(${(s0+(1-s0)*e).toFixed(4)})`;
  el.style.filter=blur?`blur(${((1-e2)*blur).toFixed(1)}px)`:''}
function draw(p,t,a,dur=.6){if(!p)return;if(!p.dataset.l){const l=p.getTotalLength();p.dataset.l=l;p.style.strokeDasharray=l}const k=io3(P(t,a,a+dur));p.style.strokeDashoffset=(+p.dataset.l*(1-k)).toFixed(1);p.style.opacity=t<a?0:1}
const bump=(t,a,w=.35)=>t<a?0:Math.exp(-((t-a)/w)*3)*Math.min(1,(t-a)/.06);

// ======================= TIMING =======================
const W={sav:SS(2),d21:SS(3),dulu:FW(3,'dulu')-.12,tk:SS(4),kr:SS(5),apl:FW(5,'apalagi')-.1,cs:SS(6),mt:SS(7),jn:FW(7,'jurnal')-.06,nt:FW(7,'nonton')-.06,bg:FW(7,'berbagi')-.06,bh:SS(8),now:SS(9),ai:SS(10),yt:SS(11),jr:SS(12),bk:FW(12,'bahkan')-.1,md:SS(13),q:SS(14),ms:FW(14,'masih')-.1,gm:SS(15),sp:SS(16),sp2:SS(17),cl:SS(18),js:FW(18,'justru')-.15};

// ======================= ICONS =======================
const IC={
 bolt:c=>`<svg viewBox="0 0 100 160" width="100%" height="100%"><path d="M62 0 L8 92 L44 92 L30 160 L92 58 L56 58 Z" fill="${c}"/></svg>`,
 watch:c=>`<svg viewBox="0 0 200 220" width="100%" height="100%"><rect x="84" y="0" width="32" height="22" rx="6" fill="${c}"/><circle cx="100" cy="125" r="88" fill="none" stroke="${c}" stroke-width="16"/><path id="wh" d="M100 125 L100 62" stroke="${c}" stroke-width="12" stroke-linecap="round"/></svg>`,
 book:`<svg viewBox="0 0 230 170" width="100%" height="100%"><path d="M115 30 C85 14 40 14 12 24 V150 C40 140 85 140 115 156 Z" fill="#FFF3D6"/><path d="M115 30 C145 14 190 14 218 24 V150 C190 140 145 140 115 156 Z" fill="#F5DFAF"/><g stroke="#C9A86A" stroke-width="4">${[48,68,88,108].map(y=>`<line x1="32" y1="${y}" x2="96" y2="${y-4}"/><line x1="134" y1="${y-4}" x2="198" y2="${y}"/>`).join('')}</g><path class="flip" d="M115 30 C145 14 190 14 218 24 V150 C190 140 145 140 115 156 Z" fill="#FFFBF0" style="transform-origin:115px 90px"/></svg>`,
 doc:`<svg viewBox="0 0 200 240" width="100%" height="100%"><rect x="20" y="10" width="160" height="220" rx="14" fill="#fff"/><rect class="hl" x="38" y="86" width="124" height="22" rx="5" fill="#FFD36B" style="transform-origin:38px 97px"/><g fill="#B8C2D6">${[40,62,90,114,138,162,186].map((y,i)=>`<rect x="40" y="${y}" width="${[120,100,120,90,116,80,104][i]}" height="10" rx="5"/>`).join('')}</g></svg>`,
 play:`<svg viewBox="0 0 240 170" width="100%" height="100%"><rect x="6" y="6" width="228" height="158" rx="34" fill="#FF0033"/><path d="M98 52 L160 85 L98 118 Z" fill="#fff"/></svg>`,
 link:`<svg viewBox="0 0 240 200" width="100%" height="100%"><g class="f0" style="transform-origin:120px 175px"><rect x="55" y="25" width="130" height="160" rx="14" fill="#C9F0D8"/></g><g class="f1" style="transform-origin:120px 175px"><rect x="55" y="25" width="130" height="160" rx="14" fill="#E3FAEC"/></g><g class="f2" style="transform-origin:120px 175px"><rect x="55" y="25" width="130" height="160" rx="14" fill="#fff"/><path d="M92 128 a16 16 0 0 1 0-22 l12-12 a16 16 0 0 1 22 22 l-5 5 M150 102 a16 16 0 0 1 0 22 l-12 12 a16 16 0 0 1-22-22 l5-5" stroke="#16A34A" stroke-width="9" fill="none" stroke-linecap="round"/></g></svg>`,
 gem:`<svg viewBox="0 0 200 180" width="100%" height="100%"><path d="M40 10 H160 L196 60 L100 176 L4 60 Z" fill="#FFE9A8"/><path d="M4 60 H196 M40 10 L70 60 L100 176 L130 60 L160 10 M70 60 L100 10 L130 60" stroke="#C98A12" stroke-width="5" fill="none"/></svg>`,
 avatar:c=>`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="${c}"/><circle cx="50" cy="40" r="17" fill="#fff"/><path d="M18 88 q32 -42 64 0" fill="#fff"/></svg>`,
 heart:c=>`<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 21s-7-4.6-9.3-9C1 8.4 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.4 19.3 12c-2.3 4.4-7.3 9-7.3 9z" fill="${c}"/></svg>`,
 search:c=>`<svg viewBox="0 0 30 30" width="100%" height="100%"><circle cx="12" cy="12" r="9" stroke="${c}" stroke-width="3.2" fill="none"/><path d="M19 19 L27 27" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/></svg>`};

// ======================= SCENES =======================
// each: id, a (start), tr (transition IN), dark (subtitle colors), bg html, html content, upd(t,lt,el), cam [z0,z1,r0,r1,x0,x1,y0,y1], punch times
const SCN=[];const S=(o)=>SCN.push(o);
const dots=(n,col,seed,size=[6,16])=>Array.from({length:n},(_,i)=>`<i class="dot dd" data-i="${i+seed}" style="width:${L(size[0],size[1],hsh(i+seed))}px;height:${L(size[0],size[1],hsh(i+seed))}px;background:${col}"></i>`).join('');
const grain=`<div class="ab grain" style="inset:0;background-size:1080px 1920px;opacity:.10;mix-blend-mode:overlay"></div>`;
// 1 HOOK
S({id:'hook',a:0,tr:'cut',dark:1,cam:[1.0,1.07,-.8,.6,0,0,0,-20],punch:[FW(0,'instan'),FW(0,'cepat')],
 bg:`<div class="ab" style="inset:0;background:radial-gradient(circle at 50% 32%,#2547A8 0%,#0E1E52 42%,#050A1C 100%)"></div><div class="ab rays" style="left:-660px;top:-560px;width:2400px;height:2400px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.06) 0 4deg,rgba(255,255,255,0) 4deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%)"></div>${dots(30,'rgba(140,190,255,.6)',3)}${grain}`,
 html:`<div class="L" id="h_q" style="top:210px;font-size:40px;color:#9CC2FF">kenapa mahasiswa sekarang</div>
  <div class="T sh" id="h_s" style="top:290px;font-size:128px">maunya serba</div>
  <div class="ico" id="h_b" style="left:40px;top:440px;width:150px;height:240px">${IC.bolt('#FFD36B')}</div>
  <div class="T sh" id="h_i" style="top:470px;font-size:250px;color:#FFD36B">INSTAN</div>
  <div class="T S sh" id="h_c" style="top:730px;font-size:170px;left:-80px">&amp; cepat?</div>
  <div class="ico" id="h_w" style="left:800px;top:700px;width:200px;height:220px">${IC.watch('#fff')}</div>`,
 upd(t){A($('#h_q'),t,1.25,{dy:30,s0:.9});A($('#h_s'),t,FW(0,'maunya')-.12,{dy:60,s0:.8});A($('#h_b'),t,FW(0,'instan')-.15,{dy:-120,s0:.3,r:-30});A($('#h_i'),t,FW(0,'instan')-.12,{dy:0,s0:1.8,d:.3,blur:20});
   A($('#h_c'),t,FW(0,'cepat')-.12,{dx:-200,dy:0,s0:.8});A($('#h_w'),t,FW(0,'cepat')-.05,{dy:0,s0:.2,r:90});const wh=$('#wh');if(wh)wh.setAttribute('transform',`rotate(${(t*360)%360} 100 125)`)}});
// 2 MENYERAH
S({id:'gave',a:SS(1),tr:'whip',dark:1,cam:[1.16,1.1,.5,-.5,0,0,250,230],punch:[FW(1,'menyerah')],
 bg:`<div class="ab" style="inset:0;background:radial-gradient(circle at 50% 55%,#4A1212 0%,#1A1414 55%,#0A0A0A 100%)"></div><div class="ab pulse" style="left:40px;top:560px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(255,70,70,.35),rgba(255,70,70,0) 65%)"></div>${grain}`,
 html:`<div class="L" style="top:230px;font-size:40px;color:#FF9C9C" id="g_l">memahami materi</div>
  <div class="T" id="g_n" style="top:310px;font-size:300px">0%</div>
  <div class="ab" id="g_bar" style="left:70px;top:650px;width:940px;height:90px;border-radius:45px;background:rgba(255,255,255,.12);overflow:hidden"><i id="g_f" style="position:absolute;left:0;top:0;bottom:0;width:0;border-radius:45px;background:linear-gradient(90deg,#3D8BFF,#7CC0FF)"></i></div>
  <div class="ab" id="g_x" style="left:690px;top:790px;padding:22px 36px;border-radius:26px;background:#fff;color:#111;font-family:PJS;font-size:52px">Tutup ✕</div>
  <svg id="g_cur" class="ov" width="90" height="90"><path d="M9 6 L9 66 L25 50 L37 78 L48 73 L36 47 L60 47 Z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>
  <div class="T sh" id="g_m" style="top:930px;font-size:200px;color:#FF5A5A">menyerah.</div>`,
 upd(t){const a=SS(1),f0=FW(1,'memahami')-.1,f1=FW(1,'sedikit')+.35,ck=FW(1,'udah')-.05;A($('#g_l'),t,a+.1,{dy:30});A($('#g_n'),t,a+.15,{dy:0,s0:.6});A($('#g_bar'),t,a+.2,{dy:40,s0:.9});
   const v=Math.round(18*o3(P(t,f0,f1)));$('#g_n').textContent=v+'%';$('#g_f').style.width=(v/100*940).toFixed(1)+'px';
   const dim=P(t,ck,ck+.25);$('#g_f').style.background=dim>.5?'#FF5A5A':'linear-gradient(90deg,#3D8BFF,#7CC0FF)';const sh=dim>0&&dim<1?Math.sin(t*90)*14*(1-dim):0;$('#g_n').style.marginLeft=sh.toFixed(1)+'px';
   A($('#g_x'),t,FW(1,'aja')-.3,{dy:40,s0:.6});$('#g_x').style.transform+=` scale(${(1-.12*Math.sin(Math.PI*P(t,ck,ck+.2))).toFixed(3)})`;
   const c=$('#g_cur'),ca=FW(1,'aja')-.25,m=io3(P(t,ca,ck));c.style.transform=`translate(${L(560,860,m).toFixed(1)}px,${L(1240,820,m).toFixed(1)}px)`;op(c,P(t,ca,ca+.15));
   A($('#g_m'),t,FW(1,'menyerah')-.1,{dy:0,s0:2.2,d:.28,blur:24})}});
// 3 SAVE & FOLLOW
S({id:'save',a:SS(2),tr:'zoom',dark:1,cam:[1.0,1.06,0,1,0,-20,0,0],punch:[FW(2,'save'),FW(2,'follow')],
 bg:`<div class="ab" style="inset:0;background:linear-gradient(160deg,#FFB547 0%,#FF7A2F 55%,#E84E1B 100%)"></div><div class="ab half" style="left:-100px;top:-100px;width:1300px;height:2200px;background-image:radial-gradient(rgba(255,255,255,.22) 26%,transparent 28%);background-size:44px 44px;-webkit-mask-image:linear-gradient(135deg,#000 10%,transparent 55%)"></div>${grain}`,
 html:`<div class="ico" id="s_bm" style="left:70px;top:230px;width:330px;height:420px"><svg viewBox="0 0 150 190" width="100%" height="100%"><path d="M20 10 h110 a10 10 0 0 1 10 10 v160 l-65 -45 l-65 45 v-160 a10 10 0 0 1 10 -10z" fill="#FFF3D6"/></svg></div>
  <div class="T sh" id="s_sv" style="left:40px;width:400px;top:690px;font-size:120px">SAVE</div>
  <div class="ico" id="s_fo" style="left:600px;top:250px;width:400px;height:400px">${IC.avatar('#1E5BFF')}<div style="position:absolute;right:-6px;top:-6px;width:150px;height:150px;border-radius:50%;background:#fff;color:#1E5BFF;font-family:PJS;font-size:130px;line-height:140px;text-align:center">+</div></div>
  <div class="T sh" id="s_fl" style="left:560px;width:480px;top:690px;font-size:120px">FOLLOW</div>
  <div class="T S sh" id="s_rl" style="top:860px;font-size:120px;left:-140px">kalau lo relate?</div>`,
 upd(t){A($('#s_bm'),t,FW(2,'save')-.15,{dy:-200,s0:.3,r:-25});A($('#s_sv'),t,FW(2,'save')-.05,{dy:60,s0:.7});A($('#s_fo'),t,FW(2,'follow')-.15,{dy:-200,s0:.3,r:25});A($('#s_fl'),t,FW(2,'follow')-.05,{dy:60,s0:.7});A($('#s_rl'),t,FW(2,'kalau')-.1,{dx:-120,dy:0,s0:.9})}});
// 4 2021 (full-bleed photo, rewind)
S({id:'y21',a:SS(3),tr:'rewind',dark:1,cam:[1.22,1.1,-1,0,0,0,250,230],punch:[FW(3,'2021')],
 bg:`<div class="ab kb" style="inset:-60px;background:url(${PH.library_warm_lights}) center/cover;filter:sepia(.55) saturate(1.1) brightness(.62) contrast(1.1)"></div><div class="ab" style="inset:0;background:linear-gradient(180deg,rgba(60,30,8,.55),rgba(40,20,5,.15) 45%,rgba(20,10,2,.75))"></div><div class="ab leak" style="left:-300px;top:200px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(255,160,60,.45),rgba(255,160,60,0) 62%)"></div><div class="ab scan" style="inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px)"></div>${grain}`,
 html:`<div class="L" id="y_r" style="top:250px;font-size:44px;color:#FFE2A8">◀◀ kembali ke</div>
  <div class="T sh" id="y_n" style="top:360px;font-size:320px;color:#FFF4DC">2026</div>
  <div class="T S sh" id="y_k" style="top:760px;font-size:150px;color:#FFE2A8">masa kuliah</div>`,
 upd(t){A($('#y_r'),t,SS(3)+.1,{dy:20});A($('#y_n'),t,SS(3)+.05,{dy:0,s0:1.4,d:.3,blur:20});A($('#y_k'),t,FW(3,'kuliah')-.15,{dy:50,s0:.8});
   const y1=FW(3,'2021')+.05;$('#y_n').textContent=Math.round(L(2026,2021,io3(P(t,SS(3)+.15,y1))));$('#y_n').style.color=t>=y1?'#FFC94D':'#FFF4DC'}});
// 5 BELUM ADA AI (notebook paper)
S({id:'noai',a:W.dulu,tr:'flip',dark:0,cam:[1.06,1.1,.6,-.4,0,0,160,150],punch:[FW(3,'seperti')],
 bg:`<div class="ab" style="inset:0;background:#F6EEDC"></div><div class="ab" style="inset:0;background:repeating-linear-gradient(180deg,transparent 0 78px,rgba(70,110,170,.25) 78px 81px)"></div><div class="ab" style="left:120px;top:0;width:4px;height:1920px;background:rgba(220,60,60,.45)"></div>${grain}`,
 html:`<div class="L" id="n_l" style="top:230px;font-size:46px;color:#7A5530">dulu belum ada</div>
